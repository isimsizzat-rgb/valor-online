const MOUNT_ART='assets/images/uc_basli_ejderha.webp';
const DRAGON_PRICE=50000;
const DRAGON_BONUS={Güç:100,Zeka:100,Zırh:100,Beden:100};
function dragonTokenIndex(){return (state.inventory||[]).findIndex(i=>i.mountId==='threeDragon')}
function dragonRegistered(){return !!state.dragonRegistered||!!state.dragonActive||!!state.mountsV1?.owned?.includes('threeDragon')}
function dragonPurchased(){return dragonRegistered()||dragonTokenIndex()>=0}
function buyDragon(){if(dragonPurchased())return toast('Binek kartı zaten çantanda');if(state.gold<DRAGON_PRICE)return toast('Yeterli altının yok');state.gold-=DRAGON_PRICE;state.inventory.push({id:Date.now(),name:'Üç Başlı Ejderha',slot:'Binek',mountId:'threeDragon',cls:state.class,level:1,plus:0,epic:true});state.dragonUnlocked=true;save();render();toast('Binek kartı çantana eklendi')}
function activateDragon(){const idx=dragonTokenIndex();if(idx<0)return toast(dragonRegistered()?'Bu binek zaten koleksiyonunda':'Önce çantadaki binek kartını kullan');state.inventory.splice(idx,1);selected=null;state.dragonRegistered=true;state.dragonUnlocked=true;const mounts=vmData();if(!mounts.owned.includes('threeDragon'))mounts.owned.push('threeDragon');state.dragonActive=true;save();render();toast('Üç Başlı Ejderha kalıcı olarak koleksiyonuna eklendi')}
function deactivateDragon(){toast('Kullanılan binek kalıcıdır, pasifleştirilemez')}
function buyMarketMount(id){const m=valorMounts.find(x=>x.id===id&&x.price);if(!m)return;const d=vmData();if(d.owned.includes(id))return toast('Bu binek zaten koleksiyonunda');if(state.gold<m.price)return toast('Yeterli altının yok');state.gold-=m.price;d.owned.push(id);save();render();toast(m.name+' koleksiyonuna eklendi! +'+vmSpirit(m)+' Binek Ruhu')}

const marketProducts=[
{id:'mountStone',name:'Binek Taşı',price:10,limit:50,icon:'🔮',description:'Binek eğitiminde kullanılan taş.'},
{id:'expeditionPaper',name:'Sefer Kağıdı',price:99,limit:3,icon:'📜',description:'Sahnelere bir ek giriş hakkı verir.'},
{id:'energyBottle',name:'Enerji Şişesi',price:50,limit:5,icon:'🧪',description:'Macera enerjini 50 artırır.'},
{id:'anniversaryBox',name:'Yıldönümü Kutusu',price:20,limit:100,icon:anniversaryBoxGraphic(),description:'Binek ve taş ödülleri içeren özel kutu.'}
];
function marketTodayKey(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Istanbul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),v={};p.forEach(x=>{v[x.type]=x.value});return v.year+'-'+v.month+'-'+v.day}
function marketDailyReset(){const day=marketTodayKey();if(state.marketDailyDate!==day){state.marketDailyDate=day;state.marketDailyPurchases={};save()}if(!state.marketDailyPurchases)state.marketDailyPurchases={};if(state.marketAnniversaryTapRepairDay!==day){if(state.marketDailyDate===day&&(Number(state.marketDailyPurchases.anniversaryBox)||0)>=100)state.marketDailyPurchases.anniversaryBox=0;state.marketAnniversaryTapRepairDay=day;save()}}
function marketProduct(id){return marketProducts.find(p=>p.id===id)||({mosaicStone:{id:'mosaicStone',name:'Mozaik Taş Çantası',icon:mosaicStoneBagGraphic(),description:'İçinden rastgele türde ve Sv.1–4 arasında bir mozaik taşı çıkar.'},luckBag:{id:'luckBag',name:'Şans Taşı Çantası',icon:luckStoneBagGraphic(),description:'İçinden güçlendirmede kullanılabilen Sv.1–4 arasında rastgele bir şans taşı çıkar.'},luckStone:{id:'luckStone',name:'Şans Taşı',icon:luckStoneGraphic(),description:'Ekipman güçlendirmesinde kullanılan taş.'}})[id]}
function marketRemaining(p){marketDailyReset();return Math.max(0,p.limit-(Number(state.marketDailyPurchases[p.id])||0))}
function addMarketStack(id,count){const p=marketProduct(id);if(!p)return;const old=state.inventory.find(i=>i.marketItemId===id);if(old)old.count=(Number(old.count)||1)+count;else state.inventory.push({id:valorUniqueItemId(),slot:'Eşya',marketItemId:id,name:p.name,count:count,description:p.description})}
function marketQtySet(value){const p=marketProduct(marketPurchaseId);if(!p)return;const left=marketRemaining(p);marketPurchaseQty=Math.max(1,Math.min(left,parseInt(value,10)||1));const q=document.getElementById('vmMarketPurchaseQty'),t=document.getElementById('vmMarketPurchaseTotal'),b=document.getElementById('vmMarketPurchaseConfirm');if(q)q.value=marketPurchaseQty;if(t)t.textContent=money(p.price*marketPurchaseQty)+' 💎';if(b)b.disabled=left<1}function marketQtyChange(delta){marketQtySet(marketPurchaseQty+delta)}
function closeMarketPurchase(){const e=document.getElementById('vm-market-purchase');if(e)e.remove();marketPurchaseId=null}
function openMarketPurchase(id){const p=marketProduct(id);if(!p)return;marketDailyReset();marketPurchaseId=id;marketPurchaseQty=1;const left=marketRemaining(p),overlay=document.createElement('div');overlay.id='vm-market-purchase';overlay.className='vm-market-purchase-overlay';overlay.innerHTML='<div class="vm-market-purchase-dialog" role="dialog" aria-modal="true" aria-label="'+p.name+' satın al"><button class="vm-market-purchase-close" onclick="closeMarketPurchase()" aria-label="Kapat">×</button><div class="vm-market-purchase-art">'+p.icon+'</div><div class="vm-market-purchase-kicker">SINIRLI MAĞAZA</div><h2>'+p.name+'</h2><p>'+p.description+'</p>'+(id==='anniversaryBox'?'<button type="button" class="vm-box-drop-open" onclick="openAnniversaryDropRates()">Kutudan Çıkabilecekler</button>':'')+'<div class="vm-market-limit">Günlük alım: <b>'+(Number(state.marketDailyPurchases[id])||0)+' / '+p.limit+'</b><br>Kalan: <b>'+left+'</b></div><div class="vm-market-qty"><button type="button" onclick="marketQtyChange(-1)" aria-label="Bir eksilt">−</button><input id="vmMarketPurchaseQty" type="number" inputmode="numeric" min="1" max="'+left+'" value="1" aria-label="Alınacak ürün adedi" oninput="marketQtySet(this.value)"><button type="button" onclick="marketQtyChange(1)" aria-label="Bir artır">+</button></div><div class="vm-market-total"><span>Toplam</span><strong id="vmMarketPurchaseTotal">'+money(p.price)+' 💎</strong></div><button type="button" id="vmMarketPurchaseConfirm" class="vm-market-buy-confirm" '+(left<1?'disabled':'')+' onclick="buyMarketProduct()">Satın Al</button></div>';overlay.addEventListener('click',e=>{if(e.target===overlay)closeMarketPurchase()});document.body.appendChild(overlay)}
function openAnniversaryDropRates(){const overlay=document.createElement('div');overlay.id='vm-box-drop-rates';overlay.className='vm-box-drop-overlay';overlay.innerHTML='<section class="vm-box-drop-dialog" role="dialog" aria-modal="true" aria-label="Yıldönümü Kutusu ödülleri"><button class="vm-market-purchase-close" onclick="closeAnniversaryDropRates()" aria-label="Kapat">×</button><div class="vm-market-purchase-kicker">YILDÖNÜMÜ KUTUSU</div><h2>Kutudan Çıkabilecekler</h2><p class="vm-box-drop-note">Binek çıkma ihtimali toplam %0,2. Taş çantalarının içeriği: Sv.1 %60 · Sv.2 %25 · Sv.3 %14 · Sv.4 %1.</p><div class="vm-box-drop-row vm-box-drop-purple"><span>✦ 30 değerli binek</span><b>%0,1</b></div><div class="vm-box-drop-row vm-box-drop-purple"><span>✦ 50 değerli binek</span><b>%0,1</b></div><div class="vm-box-drop-row vm-box-drop-yellow"><span>◆ Binek Taşı</span><b>Yaklaşık %33,27</b></div><div class="vm-box-drop-row vm-box-drop-yellow"><span>◆ Mozaik Taş Çantası</span><b>Yaklaşık %33,27</b></div><div class="vm-box-drop-row vm-box-drop-white"><span>◇ Şans Taşı Çantası</span><b>Yaklaşık %33,27</b></div><button type="button" class="vm-box-drop-close" onclick="closeAnniversaryDropRates()">Kapat</button></section>';overlay.addEventListener('click',e=>{if(e.target===overlay)closeAnniversaryDropRates()});document.body.appendChild(overlay)}function closeAnniversaryDropRates(){const overlay=document.getElementById('vm-box-drop-rates');if(overlay)overlay.remove()}
function buyMarketProduct(){if(window.valorMarketBuying)return;const p=marketProduct(marketPurchaseId);if(!p)return;const left=marketRemaining(p),qty=Math.max(1,Math.floor(marketPurchaseQty));if(qty>left)return toast('Günlük alım limitine ulaştın');const price=p.price*qty;if((Number(state.diamonds)||0)<price)return toast('Yeterli elmasın yok');window.valorMarketBuying=true;const confirmButton=document.getElementById('vmMarketPurchaseConfirm');if(confirmButton){confirmButton.disabled=true;confirmButton.textContent='Satın alınıyor…'}requestAnimationFrame(()=>{try{const nav=document.querySelector('.vm-market-categories'),navScroll=nav?nav.scrollLeft:0,scrollTop=window.scrollY;state.diamonds-=price;state.marketDailyPurchases[p.id]=(Number(state.marketDailyPurchases[p.id])||0)+qty;addMarketStack(p.id,qty);save();closeMarketPurchase();render();const newNav=document.querySelector('.vm-market-categories');if(newNav)newNav.scrollLeft=navScroll;window.scrollTo(0,scrollTop);toast(qty+' adet '+p.name+' çantana eklendi')}finally{window.valorMarketBuying=false}})}
function marketItemEmoji(id,item){if(id==='luckStone')return luckStoneGraphic(item&&item.stoneLevel);const p=marketProduct(id);return p?p.icon:'🎁'}
function marketItemDescription(id){const p=marketProduct(id);return p?p.description:''}
function consumeMarketStack(n){const it=state.inventory[n];if(!it)return null;if((Number(it.count)||1)>1)it.count--;else state.inventory.splice(n,1);return it}
function addLuckStoneStack(level,count){const lv=Math.max(1,Math.min(4,Number(level)||1)),old=state.inventory.find(i=>i.marketItemId==='luckStone'&&Number(i.stoneLevel||1)===lv);if(old)old.count=(Number(old.count)||1)+count;else state.inventory.push({id:valorUniqueItemId(),slot:'Eşya',marketItemId:'luckStone',stoneLevel:lv,name:'Şans Taşı Sv.'+lv,count:count,description:'Ekipman güçlendirmesinde başarı şansını artırır.'})}function giveAnniversaryBoxReward(){const r=Math.random();if(r<.002){const tier=Math.random()<.5?30:50,m=valorMounts.find(x=>x.id===(tier===30?'yildonumu30':'yildonumu50'));state.inventory.push({id:valorUniqueItemId(),slot:'Binek',mountId:m.id,name:m.name,cls:state.class,level:1,epic:true});return m.name+' kazandın!'}if(r<.002+.998/3){addMarketStack('mountStone',1);return 'Binek Taşı kazandın!'}if(r<.002+.998*2/3){addMarketStack('mosaicStone',1);return 'Mozaik Taş Çantası kazandın!'}addMarketStack('luckBag',1);return 'Şans Taşı Çantası kazandın!'}

let bossAttacking=false,bossView='battle',bossLastHit=0,bossCritical=false;
function bossSchedule(){
 const now=Date.now(),d=new Date(),ymd=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
 for(const h of [10,20]){const start=new Date(d.getFullYear(),d.getMonth(),d.getDate(),h).getTime();if(now>=start&&now<start+900000)return {active:true,id:ymd+'-'+h,end:start+900000};}
 const next=[10,20].map(h=>new Date(d.getFullYear(),d.getMonth(),d.getDate(),h).getTime()).find(t=>t>now)||new Date(d.getFullYear(),d.getMonth(),d.getDate()+1,10).getTime();
 return {active:true,id:ymd+'-test',end:now+900000,test:true,next};
}
function bossStore(){return state.worldBoss||(state.worldBoss={sessions:{},pending:[]})}
function bossSession(id){const store=bossStore();return store.sessions[id]||(store.sessions[id]={damage:0,hits:0,crits:0,paid:false})}
function bossSettle(){
 if(!state.class)return;
 const store=bossStore();
 for(const [id,s] of Object.entries(store.sessions)){
  if(s.paid)continue;
  const m=id.match(/^(\\d{4})-(\\d{2})-(\\d{2})-(10|20)$/);if(!m)continue;
  if(Date.now()<new Date(+m[1],+m[2]-1,+m[3],+m[4],15).getTime())continue;
  s.paid=true;s.reward=Math.floor(s.damage);s.bonus=0;
  if(s.hits){state.gold+=s.reward;store.pending.push(id);}
  save();
 }
}
function bossPage(){
 bossSettle();const store=bossStore(),w=bossSchedule(),e=w.active?bossSession(w.id):null;
 if(store.pending.length){
 const id=store.pending[0],r=store.sessions[id];
 return '<div class="wb-wrap"><h1>🏆 BOSS SAVAŞI SONA ERDİ!</h1><div class="wb-card"><p>Verdiğin toplam hasar</p><h2>'+money(r.damage)+'</h2><p>Kazandığın altın</p><h2 style="color:#e4b967">🪙 '+money(r.reward)+'</h2></div><button onclick="bossClaim()">Ödülü Al</button></div>';
 }
 const seconds=w.active?Math.max(0,Math.ceil((w.end-Date.now())/1000)):0;
 const timer=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');
 return '<div class="wb-wrap"><div class="wb-title"><b>☠️ DÜNYA BOSSU · TEST</b><b>'+(w.active?timer:'KAPALI')+'</b></div><div class="wb-art"><img class="wb-demon" src="assets/images/boss_art.webp" alt="Kadimlerin Efendisi şeytani dünya bossu"><h2>KADİMLERİN EFENDİSİ</h2><p>∞ SINIRSIZ CAN</p></div><div class="wb-card wb-ranking"><h3>🏆 Hasar Sıralaması</h3><div class="wb-rank-row"><span>1. Sen</span><strong>'+money(e?.damage||0)+' hasar</strong></div><p class="small">Şimdilik yalnızca kendi hasarın görüntüleniyor. Diğer oyuncular için ortak sunucu gerekiyor.</p></div><button '+(!w.active?'disabled':'')+' onclick="bossAttacking=!bossAttacking;render()">'+(bossAttacking?'⏸ Saldırıyı Durdur':'⚔️ Saldırıyı Başlat')+'</button><p class="small">'+(w.active?'Her saniye otomatik vuruş. Ekrandan çıkınca saldırı durur.':'Sonraki etkinlik: '+new Date(w.next).toLocaleString('tr-TR'))+'</p></div>';
}
function bossClaim(){bossStore().pending.shift();save();render()}
function bossTick(){
 if(!state.class)return;
 const w=bossSchedule();
 if(!w.active)bossAttacking=false;
 bossSettle();
 if(!bossAttacking||page!=='Dünya Bossu'||document.hidden)return;
 const e=bossSession(w.id);
 const base=Math.max(1,Math.round(combatPower()+state.level*4));
 const crit=Math.random()<Math.min(1,Math.max(0,(state.stats.Kritik||0)+250)/5000);
 const hit=Math.round(base*(crit?2:1));
 e.damage+=hit;e.hits++;if(crit)e.crits++;
 bossLastHit=hit;bossCritical=crit;save();
}
setInterval(()=>{bossTick();if(page==='Dünya Bossu'&&state.class)render()},1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)bossAttacking=false});
window.addEventListener('pagehide',()=>{bossAttacking=false});

function equipmentPower(i){return i?Math.floor((10+i.level*4)*(1+i.plus*.13)*(i.epic?1.5:1)):0}function combatPower(){const mage=state.class==='Büyücü',bonuses=equipmentBonuses(),mount=vmDerived(),weights={'Saldırı':mage?3:10,'Sihir':mage?10:3,'Savunma':10,'Sihir Savunma':10,'Can':3,'Kritik':4,'Bloke':4};return Math.round(Object.keys(weights).reduce((sum,k)=>sum+((Number(state.stats?.[k])||0)+(Number(bonuses[k])||0)+(Number(mount[k])||0))*weights[k],0))}
function profile(){const cls=classes.indexOf(state.class);const image=heroImages[Math.max(0,cls)];const positions=['Silah','Zırh','Kask','Ayakkabı','Kolye','Küpe'];const tile=(slot)=>{const it=state.equipped[slot];return `<button type="button" class="vp-slot ${it?.epic?'is-epic':''}" onclick="profileItem(event,'${slot}')" title="${slot}${it?' — '+escapeAttr(it.name):''}">${it?`<img src="${equipmentIcon(it)}" alt="${slot}">`:`<span class="vp-empty">${icons[slot]}</span>`}${it?`<span class="vp-plus-badge">+${it.plus||0}</span>`:''}</button>`};return `<div class="vp-wrap"><div class="vp-header"><strong>${escapeAttr(state.name)}</strong><span>${state.class} · Sv. ${state.level}</span></div><div class="vp-scene"><div class="vp-hero"><img src="${image}" alt="${state.class} karakteri"></div><div class="vp-gear vp-left">${positions.slice(0,3).map(tile).join('')}</div><div class="vp-gear vp-right">${positions.slice(3).map(tile).join('')}</div></div><div class="vp-stats"><h2>Karakter İstatistikleri</h2><div class="vp-statgrid"><div class="vp-stat"><span>Seviye</span><b>${state.level} / 100</b></div><div class="vp-stat"><span>Deneyim</span><b>${state.xp} / ${state.level*100}</b></div><div class="vp-stat"><span>Dağıtılabilir Puan</span><b>${state.statPoints}</b></div>${dragonRegistered()?`<div class="vp-stat"><span>🐉 Binek Gücü</span><b>+100</b></div><div class="vp-stat"><span>🐉 Binek Zekası</span><b>+100</b></div><div class="vp-stat"><span>🐉 Binek Zırhı</span><b>+100</b></div><div class="vp-stat"><span>🐉 Binek Bedeni</span><b>+100</b></div>`:""}${Object.keys(state.stats).map(k=>`<div class="vp-stat"><span>${k}</span><b>${state.stats[k]} ${state.statPoints?`<button class="vp-plus" onclick="addStat('${k}')">+</button>`:''}</b></div>`).join('')}</div><div class="vp-exp"><div style="width:${Math.min(100,state.xp/(state.level*100)*100)}%"></div></div><p class="vp-hint">Tek tık: eşya bilgileri · Çift tık: ekipmanı çıkar.</p></div></div>`}let profileClickTimer=null;

let workshopSelectedId=null;function workshop(){let items=[...new Map([...state.inventory.filter(i=>i.slot!=='Binek'),...Object.values(state.equipped).filter(Boolean)].map(i=>[i.id,i])).values()].sort((a,b)=>Number(Object.values(state.equipped||{}).some(e=>e&&String(e.id)===String(b.id)))-Number(Object.values(state.equipped||{}).some(e=>e&&String(e.id)===String(a.id))));return `<h1>🔨 Atölye</h1><div class="tabs"><button onclick="workTab='enhance';render()">Ekipman Geliştirme</button><button onclick="workTab='stones';render()">Şans Taşı Birleştirme</button><button onclick="workTab='epic';render()">Epik Yükseltme</button></div>${workTab==='stones'?`<p>Aynı seviyeden 2 Şans Taşı + altın → 1 üst seviye Şans Taşı. Başarı %100.</p><div class="grid">${Array.from({length:7},(_,n)=>{let s=n+1,c=2500+n*5000;return `<div class="card"><h3>💎 Sv.${s} → Sv.${s+1}</h3><p>Taş: ${state.stones[s]||0} / 2</p><p>Altın: ${money(c)}</p><button ${state.gold<c||(state.stones[s]||0)<2?'disabled':''} onclick="mergeStone(${s})">Birleştir</button></div>`}).join('')}</div>`:`<p class="muted">Çantandaki ve kuşandığın eşyalar burada görünür.</p><div class="workshop-item-grid">${items.map(i=>`<button type="button" class="workshop-item-tile ${workshopSelectedId===i.id?'selected':''}" onclick="workshopSelectedId=${i.id};render()"><img class="equipment-art" src="${equipmentIcon(i)}" alt="${i.slot}"><span>${i.name}</span><small>+${i.plus||0}${i.epic?' · Epik':''}</small></button>`).join('')}</div>${(()=>{const i=items.find(x=>x.id===workshopSelectedId);return i?`<div class="card workshop-selected"><div class="item"><img class="equipment-art" src="${equipmentIcon(i)}" alt="${i.slot}"><div><b>${i.name} +${i.plus||0}</b><div class="small">${i.epic?'✨ Epik • ':''}Güç ${equipmentPower(i)}</div></div></div>${workTab==='enhance'?`<p>Başarı: %${i.plus<21?rates[i.plus]:0} • Altın: ${i.plus<21?money(costs[i.plus]):'—'}</p><div class="formrow"><label>Şans Taşı:</label><select id="stone-${String(i.id).replace('.','_')}"><option value="0">Yok</option>${Array.from({length:8},(_,n)=>`<option value="${n+1}">Sv.${n+1} (${state.stones[n+1]||0})</option>`).join('')}</select></div><button ${i.plus>=21||state.gold<costs[i.plus]?'disabled':''} onclick="enhance(${i.id})">Geliştir</button>`:`<p>Gerekli Epik Parçası: ${i.level*2} • Mevcut: ${state.shards}</p><button ${i.epic||state.shards<i.level*2?'disabled':''} onclick="epic(${i.id})">Epik Yap (%100)</button>`}</div>`:'<p class="muted">İşlem yapmak için yukarıdan bir eşya seç.</p>'})()}`}`}function getItem(id){return [...state.inventory,...Object.values(state.equipped)].find(i=>i.id===id)}function enhance(id){let i=getItem(id);if(!i||i.plus>=21)return;let st=Number(document.getElementById('stone-'+String(i.id).replace('.','_')).value),cost=costs[i.plus];if(state.gold<cost)return toast('Altın yetersiz');if(st&&!(state.stones[st]>0))return toast('Şans Taşı yetersiz');state.gold-=cost;if(st)state.stones[st]--;let chance=Math.min(100,rates[i.plus]*(1+st*.1));if(Math.random()*100<chance){i.plus++;toast('Geliştirme başarılı! +'+i.plus)}else toast('Geliştirme başarısız. Seviye korunuyor.');save();render()}function mergeStone(s){let c=2500+(s-1)*5000;if(state.gold<c||(state.stones[s]||0)<2)return;state.gold-=c;state.stones[s]-=2;state.stones[s+1]=(state.stones[s+1]||0)+1;save();render();toast('Sv.'+(s+1)+' Şans Taşı üretildi')}function epic(id){let i=getItem(id);if(!i||i.epic||state.shards<i.level*2)return;state.shards-=i.level*2;i.epic=true;save();render();toast('Ekipman Epik oldu!')}

d?.level||0;return `<h1>💎 Birlik Marketi</h1><p class="muted">Şans Taşları altınla sınırsız satın alınır. Her seviye, aynı birlik seviyesinde açılır.</p><p>Birlik seviyesi: <b>${lv||'Birliğin yok'}</b></p><div class="shop">${Array.from({length:8},(_,n)=>{let s=n+1;return `<div class="card"><h3>💎 Şans Taşı Sv.${s}</h3><p>${money(s*5000)} altın</p><p class="small">Çantadaki: ${state.stones[s]||0}</p><button ${lv<s||state.gold<s*5000?'disabled':''} onclick="buyStone(${s})">${lv<s?'🔒 Birlik Sv.'+s:'Satın Al'}</button></div>`}).join('')}</div>`}function buyStone(s){if(!state.guild||state.guild.level<s||state.gold<s*5000)return;state.gold-=s*5000;state.stones[s]=(state.stones[s]||0)+1;save();render();toast('Şans Taşı Sv.'+s+' alındı')}function valorNormalizeSelthir(){if(!state)return;let changed=false;const names={Silah:'Selthir Yayı',Zırh:'Selthir Zırhı',Kask:'Selthir Miğferi',Ayakkabı:'Selthir Çizmeleri',Kolye:'Selthir Kolyesi',Küpe:'Selthir Küpesi'};for(const it of [...(state.inventory||[]),...Object.values(state.equipped||{})]){if(it&&(it.cls==='Okçu'||it.cls==='Elf')&&it.level>25&&it.level<=50&&it.name!==names[it.slot]){it.name=names[it.slot];changed=true;}}if(changed)save();}valorNormalizeSelthir();(function(){if(!state)return;let changed=false;const names={Silah:'Varkhan Kılıcı',Zırh:'Varkhan Zırhı',Kask:'Varkhan Miğferi',Ayakkabı:'Varkhan Çizmeleri',Kolye:'Varkhan Kolyesi',Küpe:'Varkhan Küpesi'};for(const it of [...(state.inventory||[]),...Object.values(state.equipped||{})]){if(it&&it.cls==='Savaşçı'&&it.level>25&&it.level<=50&&it.name!==names[it.slot]){it.name=names[it.slot];changed=true;}}if(changed)save();})();

 const slotsToAdd=['Silah','Zırh','Kask','Ayakkabı','Kolye','Küpe'];

function equipmentBonuses(){const out={Saldırı:0,Sihir:0,Savunma:0,'Sihir Savunma':0,Can:0,Kritik:0,Bloke:0};for(const [slot,it] of Object.entries(state.equipped||{})){if(!it)continue;const p=equipmentPower(it);if(slot==='Silah')out[state.class==='Büyücü'?'Sihir':'Saldırı']+=p;else if(slot==='Zırh')out.Savunma+=p;else if(slot==='Kask'){out.Savunma+=Math.floor(p*.5);out.Can+=p*2}else if(slot==='Ayakkabı'){out.Savunma+=Math.floor(p*.5);out.Bloke+=Math.floor(p*.2)}else if(slot==='Kolye'){out.Kritik+=Math.max(1,Math.floor(p*.1));out[state.class==='Büyücü'?'Sihir':'Saldırı']+=Math.floor(p*.25)}else if(slot==='Küpe'){out['Sihir Savunma']+=Math.floor(p*.5);out.Can+=p}const seen=new Set();for(const gem of (Array.isArray(it.gems)?it.gems:[]).slice(0,4)){if(!gem||seen.has(gem.type)||!veGemTypes.includes(gem.type))continue;seen.add(gem.type);const stat=veGemStat(gem.type);if(stat)out[stat]+=veGemValue(gem.type,gem.level)}}return out}

<script id="valor-mount-system-v1">
/* Yerel test verileri: gerçek çok oyunculu sıralama değildir. */
const valorMounts=[
{id:'threeDragon',name:'Üç Başlı Ejderha',kind:'dragon',color:'#e87536',stats:[100,100,100,100],spirit:500},
{id:'griffin',name:'Griffin',kind:'griffin',color:'#e5bd5a',stats:[10,10,10,10],spirit:50},
{id:'ayazkurt',name:'Ayazkurdu',kind:'wolf',color:'#78b9e9',stats:[10,10,10,10],spirit:50},
{id:'kozy ele',name:'Közyele',kind:'horse',color:'#e87548',stats:[10,10,10,10],spirit:50},
{id:'gokkiran',name:'Gökkıran',kind:'dragon',color:'#b99aef',stats:[10,10,10,10],spirit:50},
{id:'ormanmuhafizi',name:'Orman Muhafızı',kind:'stag',color:'#74c28c',stats:[10,10,10,10],spirit:50}
,
{id:'geceyelesi',name:'Gece Yelesi',kind:'horse',color:'#7775ba',stats:[10,10,10,10],spirit:50,price:150000},
{id:'kizilpençe',name:'Kızıl Pençe',kind:'wolf',color:'#c86b51',stats:[20,20,20,20],spirit:100,price:300000},
{id:'firtinakanat',name:'Fırtına Kanat',kind:'griffin',color:'#7db3d9',stats:[20,20,20,20],spirit:100,price:600000},
{id:'golgegeyik',name:'Gölge Geyiği',kind:'stag',color:'#668c84',stats:[30,30,30,30],spirit:150,price:1000000},
{id:'obsidyenboynuz',name:'Obsidyen Boynuz',kind:'dragon',color:'#a179bd',stats:[30,30,30,30],spirit:150,price:1800000},
{id:'ayisigi',name:'Ay Işığı',kind:'horse',color:'#a9c8df',stats:[40,40,40,40],spirit:200,price:3500000},
{id:'atesgrifonu',name:'Ateş Grifonu',kind:'griffin',color:'#db8d4c',stats:[50,50,50,50],spirit:250,price:6000000},
{id:'kadimejder',name:'Kadim Ejder',kind:'dragon',color:'#d5b16b',stats:[80,80,80,80],spirit:400,price:12000000},
{id:'yildonumu30',name:'Yıldönümü Bineği · 30',kind:'horse',color:'#d9b66d',stats:[30,30,30,30],spirit:150,boxOnly:true},
{id:'yildonumu50',name:'Yıldönümü Bineği · 50',kind:'griffin',color:'#e7d29b',stats:[50,50,50,50],spirit:250,boxOnly:true}
];
function vmData(){if(!state.mountsV1){state.mountsV1={owned:valorMounts.filter(x=>x.id!=='threeDragon'&&!x.price&&!x.boxOnly).map(x=>x.id),cards:[],souls:0,temporary:[]};save()}const d=state.mountsV1;if(!d.training){d.training=Array.from({length:4},()=>({level:0,xp:0}));d.stones=100;save()}if(!d.bonus200v1){d.stones=(Number(d.stones)||0)+200;d.bonus200v1=true;save()}if(!d.bonus99999v1){d.stones=(Number(d.stones)||0)+99999;d.bonus99999v1=true;save()}return d}
function vmActive(){const d=vmData();return [...valorMounts.filter(m=>m.id==='threeDragon'?dragonRegistered():d.owned.includes(m.id)),...d.temporary.filter(t=>t.until>Date.now()).map(t=>valorMounts.find(m=>m.id===t.id)).filter(Boolean)]}
function vmSpirit(m){return Math.round((m.stats||[]).reduce((sum,v)=>sum+(Number(v)||0),0)*1.25)}
function vmTotals(){const mounts=vmActive();return mounts.reduce((a,m)=>{m.stats.forEach((v,i)=>a.stats[i]+=v);a.spirit+=vmSpirit(m);return a},{stats:[0,0,0,0],spirit:0})}
function vmDerived(){const a=vmTotals().stats.map((v,i)=>v+vmData().training[i].level*5);return {Saldırı:a[0]*4,Sihir:a[1]*4,Savunma:a[2]*4,'Sihir Savunma':a[2]*4,Can:a[0]+a[1]+a[3]*40}}
function vmTrain(i,amount=1){const d=vmData(),t=d.training[i];if(!t||![1,10].includes(amount)||d.stones<amount)return toast('Binek Taşı yetersiz');d.stones-=amount;t.xp+=amount*5;let levels=0;while(t.xp>=(t.level+1)*25){t.xp-=(t.level+1)*25;t.level++;levels++}save();render();toast(amount+' taş kullanıldı: +'+(amount*5)+' EXP'+(levels?' · '+levels+' seviye yükseldi!':''))}
let vmSelectedTraining=0;
function vmSelectTraining(i){if(i<0||i>3)return;vmSelectedTraining=i;render()}
function vmTrainingUI(){const d=vmData(),base=vmTotals().stats;return '<section class="vm-board vm-training"><div class="vm-head"><h2>💎 Binek Geliştirme</h2><span class="vm-pill">Binek Taşı: '+d.stones+' (test)</span></div><p class="vm-lead">Geliştirmek istediğin özelliği seç. 1 taş = 5 EXP, her seviye +5 özellik.</p><div class="vm-train-grid">'+['Güç','Zeka','Zırh','Beden'].map((name,i)=>{const t=d.training[i],need=(t.level+1)*25,bonus=t.level*5,selected=vmSelectedTraining===i;return '<button type="button" class="vm-train-card '+(selected?'vm-train-selected':'')+'" onclick="vmSelectTraining('+i+')" aria-pressed="'+selected+'"><div class="vm-train-title"><b>'+(selected?'◉ ':'○ ')+name+'</b><span>Sv. '+t.level+'</span></div><div class="vm-train-inline"><strong>+'+(base[i]+bonus)+'</strong><span>Binek +'+base[i]+' / Gelişim +'+bonus+'</span></div><div class="vm-progress"><span style="width:'+(t.xp/need*100)+'%"></span></div><div class="vm-train-break">'+t.xp+' / '+need+' EXP</div></button>'}).join('')+'</div><div class="vm-train-footer"><span>Seçili: <b>'+['Güç','Zeka','Zırh','Beden'][vmSelectedTraining]+'</b></span><div class="vm-train-actions"><button onclick="vmTrain(vmSelectedTraining,1)" '+(d.stones<1?'disabled':'')+'>Gelişim <small>1 Taş</small></button><button onclick="vmTrain(vmSelectedTraining,10)" '+(d.stones<10?'disabled':'')+'>Hızlı Gelişim <small>10 Taş</small></button></div></div></section>'}
function vmDrawing(m){const fill=m.color;const p={griffin:'M28 112 L43 78 61 58 86 69 105 55 124 67 137 59 153 73 147 88 125 90 114 114 97 117 90 145 79 145 78 118 62 120 54 146 43 146 42 115Z',wolf:'M28 112 L47 83 56 55 73 70 95 57 107 76 129 72 149 89 137 113 117 117 110 145 98 145 95 116 65 116 61 145 47 145 47 114Z',horse:'M28 119 L48 90 66 65 83 76 101 49 117 64 112 85 139 102 150 120 124 119 117 146 103 146 103 120 66 119 59 146 45 146 45 118Z',dragon:'M23 105 L43 73 58 90 81 43 93 80 119 57 126 85 154 100 134 113 128 144 111 144 109 117 69 116 62 144 47 144 46 115Z',stag:'M31 114 L49 86 62 70 72 44 79 73 98 74 114 44 118 76 137 94 147 117 121 117 116 146 104 146 104 117 68 117 61 146 46 146 46 117Z'}[m.kind];return '<svg viewBox="0 0 180 170" aria-label="'+m.name+'" role="img"><defs><linearGradient id="g-'+m.kind+'" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff2cf"/><stop offset=".45" stop-color="'+fill+'"/><stop offset="1" stop-color="#354458"/></linearGradient></defs><ellipse cx="90" cy="149" rx="66" ry="9" fill="#000" opacity=".45"/><path d="'+p+'" fill="url(#g-'+m.kind+')" stroke="#f9e5bd" stroke-width="2"/><path d="M56 93 Q90 68 121 98" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="4"/><circle cx="120" cy="84" r="3" fill="#fff6bb"/><path d="M30 103 L14 81 M36 100 L21 67" stroke="'+fill+'" stroke-width="5" stroke-linecap="round"/></svg>'}
function vmBoard(){const me={name:state.name||'Oyuncu',score:vmTotals().spirit,me:true};const others=[{name:'KuzeyHan',score:420},{name:'Arveth',score:355},{name:'Eldoria',score:295},{name:'KaraOk',score:180},{name:'Vaelrin',score:110}];const rank=[...others,me].sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name,'tr'));const winner=rank[0];return {winner,html:'<div class="vm-board"><h2>🏆 Binek Ruhu Sıralaması</h2><p class="vm-lead">Her gün 00.00 (Türkiye saati) için tasarlanmış örnek sıralama</p>'+rank.map((p,i)=>'<div class="vm-rank '+(p.me?'me':'')+'"><b>'+(i+1)+'.</b><span>'+(i===0?'<span class="vm-tag">[Binek Tanrısı] </span>':'')+escapeAttr(p.name)+(p.me?' (Sen)':'')+'</span><b>'+p.score+'</b></div>').join('')+'<p class="vm-notice">Bu sıralamadaki diğer oyuncular test verisidir. Gerçek günlük sıralama ve TAG dağıtımı için sunucu gereklidir.</p></div>'}}
function vmMountPage(){const d=vmData();const art=["assets/images/uc_basli_ejderha.webp","https://hyper3d.ai/images/best-mounts-and-how-to-acquire-them-in-throne-and-liberty.webp","https://ik.imagekit.io/storybird/images/355f3b60-2969-4367-ba71-c889700a8703/1_846851368.png?tr=q-80","https://static.displate.com/857x1200/displate/2023-11-02/5348be19742f28a740d36a7c243aa9cd_22fe2a20a7b9ecf3ef65a5736d2e7e66.jpg","https://rtncustomcreations.com/cdn/shop/collections/dragons-and-mythical-creatures.png?v=1763916148","https://cdn.budgetpixel.com/features/ai-creature-generator/og-card.jpg"];return '<div class="vm-page vm-simplified">'+vmTrainingUI()+'<div class="vm-section-title"><div><span class="vm-eyebrow">AHIR · KOLEKSİYON</span><h2>Bineklerim</h2></div></div><div class="vm-cards">'+valorMounts.map((m,i)=>{const owned=m.id==='threeDragon'?dragonRegistered():d.owned.includes(m.id);const dragon=m.id==='threeDragon',token=dragon&&dragonTokenIndex()>=0;return '<article class="vm-card" style="--mount-color:'+m.color+'"><div class="vm-art vm-real-art" style="--vm-glow:'+m.color+'55"><img src="'+art[i]+'" alt="'+m.name+' binek görseli" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><div class="vm-image-fallback" style="display:none">'+vmDrawing(m)+'</div></div><div class="vm-card-content"><h3>'+m.name+'</h3><div class="vm-spirit-stat">✦ Ruh Değeri <b>'+vmSpirit(m)+'</b></div><div class="vm-stats">'+['Güç','Zeka','Zırh','Beden'].map((k,j)=>'<span>'+k+' <b>+'+m.stats[j]+'</b></span>').join('')+'</div><div class="vm-card-state">'+(dragon?(owned?'✓ Koleksiyonda':token?'Çantada · Kullanılmadı':'🔒 Kilitli'):(owned?'✓ Koleksiyonda':'Kilitli'))+'</div>'+(dragon?(owned?'':token?'<button onclick="go(\'Çanta\')">Çantadan Kullan</button>':'<button onclick="go(\'Market\')">Marketten Al</button>'):'')+'</div></article>'}).join('')+'</div></div>'}
function vmDuplicate(id){const d=vmData();if(d.owned.includes(id)){d.cards.push(id);save();render();toast('Fazla binek kartı alındı. Parçalanabilir.')}else{d.owned.push(id);save();render()}}
function vmShatter(){const d=vmData();const n=d.cards.length;if(!n)return;d.souls+=n*10;d.cards=[];save();render();toast(n+' kart parçalandı, +'+n*10+' harcanabilir Binek Ruhu (test)')}
const vmOldRender=render;render=function(){if(page==='Binek'&&state.class){document.body.classList.remove('valor-home');document.getElementById('gold').textContent=money(state.gold);document.getElementById('diamonds').textContent=money(state.diamonds);document.getElementById('level').textContent=state.level;nav();document.getElementById('main').innerHTML=vmMountPage();return}vmOldRender()};
const vmOldProfile=profile;profile=function(){const base=vmOldProfile(),win=vmBoard().winner;const tag=win.me?'<span class="vm-tag">✦ [Binek Tanrısı] ✦</span> ':'';return base.replace('<div class="vp-header"><strong>','<div class="vp-header"><strong>'+tag).replace('Ekipman bonusları takılı eşyalara göre hesaplanır.','Ekipman ve binek bonusları toplam istatistiklere dahildir.')};
const vmOldChat=chatPage;chatPage=function(){const w=vmBoard().winner;return vmOldChat()+'<div class="vm-chat"><b>💬 Sohbet TAG Önizlemesi</b><p>'+(w.me?'<span class="vm-tag">[Binek Tanrısı]</span> ':'')+'<b>'+escapeAttr(state.name||'Oyuncu')+':</b> Herkese iyi oyunlar!</p><p class="vm-lead">Gerçek zamanlı sohbet ve sunucu TAG doğrulaması henüz aktif değil.</p></div>'};
</script>

<style id="valor-equipment-gems-v1">

.ve-gem-dialog h3{color:#f4cb7d;margin:0 0 8px}.ve-gem-dialog p{font-size:12px;color:#c4b7a5}

@media(max-width:420px){.ve-gem-slot{min-height:58px}.ve-gem-symbol{font-size:18px}}
.ve-gem-slot.filled{border-color:var(--ve-gem-color)!important;box-shadow:inset 0 0 13px color-mix(in srgb,var(--ve-gem-color) 20%,transparent)}.ve-gem-slot.filled .ve-gem-symbol{color:var(--ve-gem-color);text-shadow:0 0 9px var(--ve-gem-color)}.ve-gem-types button{border-left:4px solid var(--ve-gem-color)!important}.ve-gem-types button.active{box-shadow:inset 0 0 13px color-mix(in srgb,var(--ve-gem-color) 24%,transparent);border-color:var(--ve-gem-color)!important}.ve-gem-slot small{font-size:9px;white-space:normal;text-align:center}</style>
<script id="valor-equipment-gems-system-v1">
/* Taşların sayısal bonusları henüz belirlenmedi; bu aşama yuva ve tür kurallarını uygular. */
const veGemTypes=['Saldırı','Sihirli Saldırı','Defans','Sihirli Defans','Kritik','Bloke','Can'];
const veGemIcons=['⚔','✦','⬡','✧','✷','◈','♥'];
const veGemColors=['#e54747','#339df5','#36b866','#eac54b','#ad64ed','#34343e','#f2f2ef'];
function veGemValue(type,level){const n=Math.max(1,Math.min(10,Number(level)||1));return type==='Can'?500+(n-1)*250:(type==='Kritik'||type==='Bloke')?50*n:100+(n-1)*125}
function veGemStat(type){return ({'Saldırı':'Saldırı','Sihirli Saldırı':'Sihir','Defans':'Savunma','Sihirli Defans':'Sihir Savunma','Kritik':'Kritik','Bloke':'Bloke','Can':'Can'})[type]}
let veGemSelection=0,veGemLevel=1;
function veGemSlots(it){if(!it)return '';const gems=Array.isArray(it.gems)?it.gems:[];return '<div class="ve-gems"><div class="ve-gems-title">💎 Ekipman Taşları · '+gems.filter(Boolean).length+'/4</div><div class="ve-gem-grid">'+Array.from({length:4},(_,i)=>{const g=gems[i];return '<button type="button" class="ve-gem-slot '+(g?'filled':'')+'" style="--ve-gem-color:'+(g?veGemColors[veGemTypes.indexOf(g.type)]:'#eac278')+'" onclick="veOpenGem(\''+String(it.id)+'\','+i+')"><span class="ve-gem-symbol">'+(g?veGemIcons[veGemTypes.indexOf(g.type)]:'◇')+'</span><b>'+(g?g.type:'Boş Yuva')+'</b><small>'+(g?'Sv. '+g.level+' · +'+veGemValue(g.type,g.level):'Taş Tak')+'</small></button>'}).join('')+'</div></div>'}
function veFindItem(id){return (state.inventory||[]).find(x=>String(x.id)===String(id))||Object.values(state.equipped||{}).find(x=>x&&String(x.id)===String(id))}
function veAddToPopup(id,popupId){const it=veFindItem(id),box=document.getElementById(popupId);if(!it||it.marketItemId||it.slot==='Binek'||!box)return;const dialog=box.querySelector('.valor-item-dialog');if(!dialog)return;const buttons=dialog.querySelector('.detail-buttons,.valor-item-remove');if(buttons)buttons.insertAdjacentHTML('beforebegin',veGemSlots(it));else dialog.insertAdjacentHTML('beforeend',veGemSlots(it))}
const veOldBagPopup=showBagItemPopup;
showBagItemPopup=function(n){veOldBagPopup(n);const it=state.inventory[n];if(it)veAddToPopup(it.id,'valor-bag-popup')};
const veOldProfileDetails=showProfileDetails;
showProfileDetails=function(slot){veOldProfileDetails(slot);const it=state.equipped[slot];if(it)veAddToPopup(it.id,'valor-item-overlay')};
function veOpenGem(id,slot){const it=veFindItem(id);if(!it||slot<0||slot>3)return;document.getElementById('ve-gem-overlay')?.remove();const gems=Array.isArray(it.gems)?it.gems:[],current=gems[slot];veGemSelection=current?veGemTypes.indexOf(current.type):0;veGemLevel=current?current.level:1;const used=new Set(gems.filter((g,i)=>g&&i!==slot).map(g=>g.type));const overlay=document.createElement('div');overlay.className='ve-gem-modal';overlay.id='ve-gem-overlay';overlay.innerHTML='<div class="ve-gem-dialog"><h3>💎 '+(slot+1)+'. Taş Yuvası</h3><p>'+escapeAttr(it.name)+' · Aynı tür taş bir ekipmana yalnızca bir kez takılabilir.</p><div class="ve-gem-types">'+veGemTypes.map((type,i)=>'<button type="button" '+(used.has(type)?'disabled':'')+' style="--ve-gem-color:'+veGemColors[i]+'" class="'+(veGemSelection===i?'active':'')+'" onclick="veSelectGem('+i+')">'+veGemIcons[i]+' '+type+(used.has(type)?' · Takılı':'')+'</button>').join('')+'</div><label for="ve-gem-level">Taş Seviyesi (1–10)</label><select id="ve-gem-level" onchange="veGemLevel=Number(this.value);veUpdateGemPreview()">'+Array.from({length:10},(_,i)=>'<option value="'+(i+1)+'" '+(veGemLevel===i+1?'selected':'')+'>Seviye '+(i+1)+'</option>').join('')+'</select><p>Test aşaması: Taş envanteri ve taşların verdiği sayısal bonuslar henüz tanımlanmadı.</p><div class="ve-gem-controls"><button onclick="veCloseGem()">Vazgeç</button>'+(current?'<button onclick="veRemoveGem(\''+String(id)+'\','+slot+')">Taşı Çıkar</button>':'')+'<button onclick="veSaveGem(\''+String(id)+'\','+slot+')">Taşı Tak</button></div></div>';overlay.addEventListener('click',e=>{if(e.target===overlay)veCloseGem()});document.body.appendChild(overlay)}
function veSelectGem(i){veGemSelection=i;document.querySelectorAll('#ve-gem-overlay .ve-gem-types button').forEach((b,j)=>b.classList.toggle('active',j===i));veUpdateGemPreview()}
function veUpdateGemPreview(){const el=document.getElementById('ve-gem-preview');if(el)el.textContent='Taş bonusu: +'+veGemValue(veGemTypes[veGemSelection],veGemLevel)+' '+veGemTypes[veGemSelection]}
function veCloseGem(){document.getElementById('ve-gem-overlay')?.remove()}
function veRefreshItemGem(id){veCloseGem();const bag=document.getElementById('valor-bag-popup'),prof=document.getElementById('valor-item-overlay');if(bag){const n=state.inventory.findIndex(x=>String(x.id)===String(id));if(n>=0)showBagItemPopup(n)}else if(prof){const slot=Object.keys(state.equipped).find(k=>state.equipped[k]&&String(state.equipped[k].id)===String(id));if(slot)showProfileDetails(slot)}render()}
function veSaveGem(id,slot){const it=veFindItem(id);if(!it)return;const type=veGemTypes[veGemSelection],level=Number(veGemLevel);if(!type||!Number.isInteger(level)||level<1||level>10)return toast('Geçersiz taş');if(!Array.isArray(it.gems))it.gems=[];if(it.gems.some((g,i)=>i!==slot&&g&&g.type===type))return toast('Bu taş türü zaten takılı!');it.gems[slot]={type,level};save();veRefreshItemGem(id);toast(type+' taşı takıldı (Sv. '+level+')')}
function veRemoveGem(id,slot){const it=veFindItem(id);if(!it||!Array.isArray(it.gems))return;it.gems[slot]=null;save();veRefreshItemGem(id);toast('Taş çıkarıldı')}
</script>

<script id="valor-progress-systems-js">
const vsIcons=['⚔️','🔮','🛡️','✨','🎯','🛡️','❤️'];
const vsNames=['Saldırı','Sihirli Saldırı','Defans','Sihirli Defans','Kritik','Bloke','Can'],vsKeys=['Saldırı','Sihir','Savunma','Sihir Savunma','Kritik','Bloke','Can'],vsSteps=[200,200,200,200,50,50,400];
function vsToday(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Istanbul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function vsData(){if(!state.valorSystems){state.valorSystems={tech:Array(7).fill(0),crystals:0,plots:Array(9).fill(0),dungeon:{day:'',cleared:0,best:0,coins:0}};save()}const d=state.valorSystems;if(d.dungeon.day!==vsToday()){d.dungeon.day=vsToday();d.dungeon.cleared=0;save()}return d}
function vsTechBonus(){const d=vsData(),out={};vsKeys.forEach((k,i)=>out[k]=(out[k]||0)+d.tech[i]*vsSteps[i]);return out}
function vsTechnology(){const d=vsData();return '<div class="vsys"><h2>🔮 Teknoloji</h2><p class="vsys-muted">💠 Kristal: '+d.crystals+' · Kristaller yalnızca çiftlik hasadından kazanılır. Geliştirme bedeli şimdilik 1 kristal.</p><div class="vsys-grid">'+vsNames.map((n,i)=>'<div class="vsys-card"><h3><span class="vsys-stat-icon" data-vi="'+(i+1)+'">'+''+'</span>'+n+'</h3><p>Seviye '+d.tech[i]+'/100 · Bonus +'+money(d.tech[i]*vsSteps[i])+'</p><div class="vsys-bar"><span style="width:'+d.tech[i]+'%"></span></div><p>Her seviye +'+vsSteps[i]+'</p><button '+(d.tech[i]>=100||d.crystals<1?'disabled':'')+' onclick="vsUpgrade('+i+')">Geliştir · 1 Kristal</button></div>').join('')+'</div></div>'}
function vsUpgrade(i){const d=vsData();if(i<0||i>6||d.tech[i]>=100)return;if(d.crystals<1)return toast('Kristal yetersiz');d.crystals--;d.tech[i]++;save();render();toast(vsNames[i]+' geliştirildi')}
function vsFarm(){const d=vsData(),open=Math.min(9,3+Math.floor(state.level/5)),now=Date.now();return '<div class="vsys"><h2>🌱 Kristal Çiftliği</h2><p class="vsys-muted">💠 Kristal: '+d.crystals+' · Açık tarla: '+open+'/9. Ücretsiz tohum ek, 10 dakika sonra 1 kristal hasat et. Diğer tarlalar 5 seviyede bir açılır.</p><div class="vsys-plots">'+d.plots.map((time,i)=>{const ready=time&&now-time>=600000;return '<div class="vsys-card"><h3>'+(i<open?'🌱':'🔒')+' Tarla '+(i+1)+'</h3><p>'+(i>=open?'Sv. '+((i-2)*5)+' gerekli':!time?'Boş tarla':ready?'Kristal hazır':'Büyüyor · '+Math.ceil((600000-(now-time))/60000)+' dk')+'</p>'+(i<open?'<button '+(time&&!ready?'disabled':'')+' onclick="vsHarvest('+i+')">'+(!time?'Tohum Ek':ready?'Hasat Et':'Büyüyor')+'</button>':'')+'</div>'}).join('')+'</div></div>'}
function vsHarvest(i){const d=vsData();if(i<0||i>=Math.min(9,3+Math.floor(state.level/5)))return;const t=d.plots[i];if(!t){d.plots[i]=Date.now();toast('Tohum ekildi')}else if(Date.now()-t>=600000){d.plots[i]=0;d.crystals++;toast('+1 kristal')}else return;save();render()}
function vsBoss(f){const a=['Kül','Ayaz','Gölge','Kan','Fırtına','Kadim','Gece','Lanet','Yıldırım','Uçurum'],b=['Muhafızı','Ejderi','Celladı','Golemi','Şövalyesi','Cadısı','Devi','Yırtıcısı','Hükümdarı','Ruhu'];return a[Math.floor((f-1)/10)]+' '+b[(f-1)%10]}
function vsEnemy(f){const tier=Math.floor((f-1)/10),elite=f%5===0;return Math.round(500+f*95+f*f*12+tier*900+(elite?1400+f*65:0))}
function vsPower(){const t=vsTechBonus(),m=vmDerived();return combatPower()+state.level*14+40+Math.round(((t.Saldırı||0)+(t.Sihir||0)+(m.Saldırı||0)+(m.Sihir||0))/8)}
function vsDungeon(){const d=vsData().dungeon,f=d.cleared+1,poison=f%5===0;return '<div class="vsys"><h2>🏰 Zindan · 100 Kat</h2><p class="vsys-muted">Bugün: '+d.cleared+'/100 · En yüksek: '+d.best+'/100 · Zindan Parası: '+d.coins+'</p><p class="vsys-muted">Her gün Türkiye saatiyle 00.00’da sıfırlanır. Her 5. kat zehirli ve güçlü boss içerir; yalnızca bu katlardan mozaik taşı ve kat/5 kadar zindan parası kazanılır.</p><div class="vsys-card"><h3>'+(f>100?'🏆 Tüm katlar tamamlandı':'Kat '+f+' · '+vsBoss(f))+'</h3>'+(f>100?'':('<p>'+(poison?'☠ Zehirli Boss':'Normal Boss')+' · Boss gücü: '+money(vsEnemy(f))+' · Senin gücün: '+money(vsPower())+'</p><p>Ödül: '+(f*30)+' EXP'+(poison?' · Rastgele Sv. '+(f<=30?'1–2':f<=60?'2–3':'3–4')+' mozaik taşı · '+(f/5)+' zindan parası':'')+'</p><button onclick="vsFight()">Boss ile Savaş</button>'))+'</div><div class="vsys-card" style="margin-top:10px"><h3>⚡ Baskın</h3><p>Önceden geçtiğin katları yeniden hızlı geç. Bedel: 1.000.000 altın.</p><button '+(d.best<=d.cleared||state.gold<1000000?'disabled':'')+' onclick="vsRaid()">Baskın Yap</button></div><div class="vsys-floors">'+Array.from({length:100},(_,i)=>'<span class="'+(i<d.cleared?'passed ':'')+((i+1)%5===0?'poison':'')+'" title="'+vsBoss(i+1)+'">'+(i+1)+'</span>').join('')+'</div></div>'}
