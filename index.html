function profile(){const cls=classes.indexOf(state.class),image=heroImages[Math.max(0,cls)],positions=['Silah','Zırh','Kask','Ayakkabı','Kolye','Küpe'],bonuses=equipmentBonuses();const tile=function(slot){const it=state.equipped[slot];return '<button type="button" class="vp-slot '+(it&&it.epic?'is-epic':'')+'" onclick="profileItem(event,\''+slot+'\')" title="'+slot+(it?' — '+escapeAttr(it.name):'')+'">'+(it?'<img src="'+equipmentIcon(it)+'" alt="'+slot+'">':'<span class="vp-empty">'+icons[slot]+'</span>')+(it?'<span class="vp-plus-badge">+'+(it.plus||0)+'</span>':'')+'</button>'};return '<div class="vp-wrap"><div class="vp-header"><strong>'+escapeAttr(state.name)+'</strong><span>'+state.class+' · Sv. '+state.level+'</span></div><div class="vp-scene"><div class="vp-hero"><img src="'+image+'" alt="'+state.class+' karakteri"></div><div class="vp-gear vp-left">'+positions.slice(0,3).map(tile).join('')+'</div><div class="vp-gear vp-right">'+positions.slice(3).map(tile).join('')+'</div></div><div class="vp-stats"><h2>Karakter İstatistikleri</h2><div class="vp-statgrid"><div class="vp-stat"><span>Toplam Ekipman Gücü</span><b>'+totalPower()+'</b></div><div class="vp-stat"><span>Seviye</span><b>'+state.level+' / 100</b></div><div class="vp-stat"><span>Deneyim</span><b>'+state.xp+' / '+(state.level*100)+'</b></div>'+Object.keys(state.stats||{}).map(function(k){const equip=Number(bonuses[k])||0;const mount=Number(vmDerived()[k])||0;const base=Number(state.stats[k])||0;const sum=base+equip+mount;return '<div class="vp-stat"><span>'+k+'</span><b>'+sum+'</b></div>'}).join('')+'</div><div class="vp-exp"><div style="width:'+Math.min(100,state.xp/(state.level*100)*100)+'%"></div></div><p class="vp-hint">Ekipman bonusları takılı eşyalara göre hesaplanır.</p></div></div>'}
function isEquipped(it){return !!it&&Object.values(state.equipped||{}).some(function(eq){return eq&&eq.id===it.id})}
function bag(){const items=state.inventory||[];if(selected!==null&&selected>=items.length)selected=null;const chosen=selected===null?null:items[selected];const statLabel=function(i){return ({Silah:state.class==='Büyücü'?'Sihir':'Saldırı',Zırh:'Savunma',Kask:'Savunma',Ayakkabı:'Savunma',Kolye:'Kritik',Küpe:'Sihir Savunma'})[i.slot]||'Güç'};return '<div class="valor-bag"><div class="bag-topline"><span>ENVANTER</span><span>'+items.length+' eşya</span></div><div class="bag-layout"><div class="bag-slots">'+(items.map(function(i,n){return '<button class="bag-slot '+(selected===n?'chosen ':'')+(i.epic?'epic ':'')+(i.cls!==state.class?'other-class ':'')+(isEquipped(i)?'is-equipped':'')+'" onclick="selectItem('+n+')" title="'+escapeAttr(i.name)+'"><img src="'+equipmentIcon(i)+'" alt="'+escapeAttr(i.name)+'">'+(isEquipped(i)?'<span class="equipped-mark">✓ TAKILI</span>':'')+'<span class="slot-plus">+'+(i.plus||0)+'</span><span class="slot-name">'+escapeAttr(i.name)+'</span></button>'}).join('')||'<div class="bag-empty">Çantanda henüz eşya bulunmuyor.</div>')+'</div><aside class="bag-details">'+(chosen?'<div class="detail-rarity '+(chosen.epic?'epic-text':'')+'">'+(chosen.epic?'✦ EPİK':'NORMAL')+' · '+chosen.slot.toLocaleUpperCase('tr-TR')+'</div><div class="detail-art '+(chosen.epic?'epic':'')+'"><img src="'+equipmentIcon(chosen)+'" alt="'+escapeAttr(chosen.name)+'"></div><h2>'+escapeAttr(chosen.name)+' +'+(chosen.plus||0)+'</h2><div class="detail-meta">'+chosen.cls+' · Seviye '+chosen.level+' · '+(chosen.epic?'Epik':'Normal')+'</div><div class="detail-stats"><div><span>'+statLabel(chosen)+'</span><strong>+'+equipmentPower(chosen)+'</strong></div><div><span>Geliştirme</span><strong>+'+(chosen.plus||0)+' / +21</strong></div><div><span>Gereken seviye</span><strong>'+chosen.level+'</strong></div></div><div class="detail-buttons"><button onclick="showBagItemPopup('+selected+')">Detayları Aç</button></div>':'<div class="detail-placeholder"><div class="detail-emblem">✦</div><h2>Eşya Detayları</h2><p>Özelliklerini görmek için bir eşyaya tıkla.</p></div>')+'</aside></div></div>'}
function selectItem(n){selected=n;render();showBagItemPopup(n)}
function showBagItemPopup(n){const it=state.inventory[n];if(!it)return;closeBagPopup();const eq=isEquipped(it),stat=it.slot==='Silah'?(it.cls==='Büyücü'?'Sihir':'Saldırı'):it.slot==='Kolye'?'Kritik':it.slot==='Küpe'?'Sihir Savunma':'Savunma';const overlay=document.createElement('div');overlay.id='valor-bag-popup';overlay.className='valor-item-overlay';overlay.innerHTML='<div class="valor-item-dialog bag-popup-dialog" role="dialog" aria-modal="true"><button class="valor-item-close" onclick="closeBagPopup()" aria-label="Kapat">×</button><div class="valor-item-art '+(it.epic?'epic':'')+'"><img src="'+equipmentIcon(it)+'" alt="'+escapeAttr(it.name)+'"></div><div class="detail-rarity '+(it.epic?'epic-text':'')+'">'+(it.epic?'✦ EPİK':'NORMAL')+' · '+it.slot.toLocaleUpperCase('tr-TR')+'</div><h3>'+escapeAttr(it.name)+' +'+(it.plus||0)+'</h3><p>'+it.cls+' · Gereken seviye: '+it.level+'</p><div class="detail-stats"><div><span>'+stat+'</span><strong>+'+equipmentPower(it)+'</strong></div><div><span>Geliştirme</span><strong>+'+(it.plus||0)+' / +21</strong></div><div><span>Durum</span><strong>'+(eq?'Takılı':'Çantada')+'</strong></div></div><div class="detail-buttons popup-actions">'+(eq?'<button onclick="unequipById(\''+String(it.id)+'\')">Çıkar</button>':'<button '+(it.cls!==state.class||it.level>state.level?'disabled':'')+' onclick="equip('+n+')">Kuşan</button>')+'<button class="danger-button" onclick="deleteInventoryItem('+n+')">Sil</button></div></div>';overlay.addEventListener('click',function(e){if(e.target===overlay)closeBagPopup()});document.body.appendChild(overlay)}
function closeBagPopup(){const e=document.getElementById('valor-bag-popup');if(e)e.remove()}
function deleteInventoryItem(n){const it=state.inventory[n];if(!it)return;if(!confirm('“'+it.name+' +'+(it.plus||0)+'” eşyasını kalıcı olarak silmek istiyor musun?'))return;Object.keys(state.equipped||{}).forEach(function(slot){if(state.equipped[slot]&&state.equipped[slot].id===it.id)delete state.equipped[slot]});state.inventory.splice(n,1);selected=null;closeBagPopup();save();render();toast('Eşya silindi')}
function equip(n){const it=state.inventory[n];if(!it||it.cls!==state.class||it.level>state.level)return toast('Bu eşyayı kuşanamazsın');state.equipped[it.slot]=it;save();closeBagPopup();render();toast(it.name+' kuşanıldı')}
function unequipById(id){const slot=Object.keys(state.equipped||{}).find(function(k){return String(state.equipped[k]&&state.equipped[k].id)===String(id)});if(slot)delete state.equipped[slot];save();closeBagPopup();render();toast('Eşya çıkarıldı')}

function unequip(slot){if(!state.equipped[slot])return;delete state.equipped[slot];save();render();toast('Eşya çantada kaldı ve çıkarıldı')}

<script id="valor-mount-system-v1">
/* Yerel test verileri: gerçek çok oyunculu sıralama değildir. */
const valorMounts=[
{id:'griffin',name:'Griffin',kind:'griffin',color:'#e5bd5a',stats:[10,10,10,10],spirit:50},
{id:'ayazkurt',name:'Ayazkurdu',kind:'wolf',color:'#78b9e9',stats:[8,4,7,8],spirit:35},
{id:'kozy ele',name:'Közyele',kind:'horse',color:'#e87548',stats:[12,2,5,7],spirit:45},
{id:'gokkiran',name:'Gökkıran',kind:'dragon',color:'#b99aef',stats:[7,12,8,9],spirit:60},
{id:'ormanmuhafizi',name:'Orman Muhafızı',kind:'stag',color:'#74c28c',stats:[5,7,12,12],spirit:40}
];
function vmData(){if(!state.mountsV1){state.mountsV1={owned:valorMounts.map(x=>x.id),cards:[],souls:0,temporary:[]};save()}const d=state.mountsV1;if(!d.training){d.training=Array.from({length:4},()=>({level:0,xp:0}));d.stones=100;save()}if(!d.bonus200v1){d.stones=(Number(d.stones)||0)+200;d.bonus200v1=true;save()}if(!d.bonus99999v1){d.stones=(Number(d.stones)||0)+99999;d.bonus99999v1=true;save()}return d}
function vmActive(){const d=vmData();return [...valorMounts.filter(m=>d.owned.includes(m.id)),...d.temporary.filter(t=>t.until>Date.now()).map(t=>valorMounts.find(m=>m.id===t.id)).filter(Boolean)]}
function vmTotals(){return vmActive().reduce((a,m)=>{m.stats.forEach((v,i)=>a.stats[i]+=v);a.spirit+=m.spirit;return a},{stats:[0,0,0,0],spirit:0})}
function vmDerived(){const a=vmTotals().stats.map((v,i)=>v+vmData().training[i].level*5);return {Saldırı:a[0]*4,Sihir:a[1]*4,Savunma:a[2]*4,'Sihir Savunma':a[2]*4,Can:a[0]+a[1]+a[3]*40}}
function vmTrain(i,amount=1){const d=vmData(),t=d.training[i];if(!t||![1,10].includes(amount)||d.stones<amount)return toast('Binek Taşı yetersiz');d.stones-=amount;t.xp+=amount*5;let levels=0;while(t.xp>=(t.level+1)*25){t.xp-=(t.level+1)*25;t.level++;levels++}save();render();toast(amount+' taş kullanıldı: +'+(amount*5)+' EXP'+(levels?' · '+levels+' seviye yükseldi!':''))}
let vmSelectedTraining=0;
function vmSelectTraining(i){if(i<0||i>3)return;vmSelectedTraining=i;render()}
function vmTrainingUI(){const d=vmData(),base=vmTotals().stats;return '<section class="vm-board vm-training"><div class="vm-head"><h2>💎 Binek Geliştirme</h2><span class="vm-pill">Binek Taşı: '+d.stones+' (test)</span></div><p class="vm-lead">Geliştirmek istediğin özelliği seç. 1 taş = 5 EXP, her seviye +5 özellik.</p><div class="vm-train-grid">'+['Güç','Zeka','Zırh','Beden'].map((name,i)=>{const t=d.training[i],need=(t.level+1)*25,bonus=t.level*5,selected=vmSelectedTraining===i;return '<button type="button" class="vm-train-card '+(selected?'vm-train-selected':'')+'" onclick="vmSelectTraining('+i+')" aria-pressed="'+selected+'"><div class="vm-train-title"><b>'+(selected?'◉ ':'○ ')+name+'</b><span>Sv. '+t.level+'</span></div><div class="vm-train-inline"><strong>+'+(base[i]+bonus)+'</strong><span>Binek +'+base[i]+' / Gelişim +'+bonus+'</span></div><div class="vm-progress"><span style="width:'+(t.xp/need*100)+'%"></span></div><div class="vm-train-break">'+t.xp+' / '+need+' EXP</div></button>'}).join('')+'</div><div class="vm-train-footer"><span>Seçili: <b>'+['Güç','Zeka','Zırh','Beden'][vmSelectedTraining]+'</b></span><div class="vm-train-actions"><button onclick="vmTrain(vmSelectedTraining,1)" '+(d.stones<1?'disabled':'')+'>Gelişim <small>1 Taş</small></button><button onclick="vmTrain(vmSelectedTraining,10)" '+(d.stones<10?'disabled':'')+'>Hızlı Gelişim <small>10 Taş</small></button></div></div></section>'}
function vmDrawing(m){const fill=m.color;const p={griffin:'M28 112 L43 78 61 58 86 69 105 55 124 67 137 59 153 73 147 88 125 90 114 114 97 117 90 145 79 145 78 118 62 120 54 146 43 146 42 115Z',wolf:'M28 112 L47 83 56 55 73 70 95 57 107 76 129 72 149 89 137 113 117 117 110 145 98 145 95 116 65 116 61 145 47 145 47 114Z',horse:'M28 119 L48 90 66 65 83 76 101 49 117 64 112 85 139 102 150 120 124 119 117 146 103 146 103 120 66 119 59 146 45 146 45 118Z',dragon:'M23 105 L43 73 58 90 81 43 93 80 119 57 126 85 154 100 134 113 128 144 111 144 109 117 69 116 62 144 47 144 46 115Z',stag:'M31 114 L49 86 62 70 72 44 79 73 98 74 114 44 118 76 137 94 147 117 121 117 116 146 104 146 104 117 68 117 61 146 46 146 46 117Z'}[m.kind];return '<svg viewBox="0 0 180 170" aria-label="'+m.name+'" role="img"><defs><linearGradient id="g-'+m.kind+'" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff2cf"/><stop offset=".45" stop-color="'+fill+'"/><stop offset="1" stop-color="#354458"/></linearGradient></defs><ellipse cx="90" cy="149" rx="66" ry="9" fill="#000" opacity=".45"/><path d="'+p+'" fill="url(#g-'+m.kind+')" stroke="#f9e5bd" stroke-width="2"/><path d="M56 93 Q90 68 121 98" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="4"/><circle cx="120" cy="84" r="3" fill="#fff6bb"/><path d="M30 103 L14 81 M36 100 L21 67" stroke="'+fill+'" stroke-width="5" stroke-linecap="round"/></svg>'}
function vmBoard(){const me={name:state.name||'Oyuncu',score:vmTotals().spirit,me:true};const others=[{name:'KuzeyHan',score:420},{name:'Arveth',score:355},{name:'Eldoria',score:295},{name:'KaraOk',score:180},{name:'Vaelrin',score:110}];const rank=[...others,me].sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name,'tr'));const winner=rank[0];return {winner,html:'<div class="vm-board"><h2>🏆 Binek Ruhu Sıralaması</h2><p class="vm-lead">Her gün 00.00 (Türkiye saati) için tasarlanmış örnek sıralama</p>'+rank.map((p,i)=>'<div class="vm-rank '+(p.me?'me':'')+'"><b>'+(i+1)+'.</b><span>'+(i===0?'<span class="vm-tag">[Binek Tanrısı] </span>':'')+escapeAttr(p.name)+(p.me?' (Sen)':'')+'</span><b>'+p.score+'</b></div>').join('')+'<p class="vm-notice">Bu sıralamadaki diğer oyuncular test verisidir. Gerçek günlük sıralama ve TAG dağıtımı için sunucu gereklidir.</p></div>'}}
function vmMountPage(){const d=vmData();const art=["https://hyper3d.ai/images/best-mounts-and-how-to-acquire-them-in-throne-and-liberty.webp","https://ik.imagekit.io/storybird/images/355f3b60-2969-4367-ba71-c889700a8703/1_846851368.png?tr=q-80","https://static.displate.com/857x1200/displate/2023-11-02/5348be19742f28a740d36a7c243aa9cd_22fe2a20a7b9ecf3ef65a5736d2e7e66.jpg","https://rtncustomcreations.com/cdn/shop/collections/dragons-and-mythical-creatures.png?v=1763916148","https://cdn.budgetpixel.com/features/ai-creature-generator/og-card.jpg"];return '<div class="vm-page vm-simplified">'+vmTrainingUI()+'<div class="vm-section-title"><div><span class="vm-eyebrow">AHIR · KOLEKSİYON</span><h2>Bineklerim</h2></div></div><div class="vm-cards">'+valorMounts.map((m,i)=>{const owned=d.owned.includes(m.id);return '<article class="vm-card" style="--mount-color:'+m.color+'"><div class="vm-art vm-real-art" style="--vm-glow:'+m.color+'55"><img src="'+art[i]+'" alt="'+m.name+' binek görseli" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><div class="vm-image-fallback" style="display:none">'+vmDrawing(m)+'</div></div><div class="vm-card-content"><h3>'+m.name+'</h3><div class="vm-stats">'+['Güç','Zeka','Zırh','Beden'].map((k,j)=>'<span>'+k+' <b>+'+m.stats[j]+'</b></span>').join('')+'</div><div class="vm-card-state">'+(owned?'✓ Koleksiyonda':'Kilitli')+'</div></div></article>'}).join('')+'</div></div>'}
function vmDuplicate(id){const d=vmData();if(d.owned.includes(id)){d.cards.push(id);save();render();toast('Fazla binek kartı alındı. Parçalanabilir.')}else{d.owned.push(id);save();render()}}
function vmShatter(){const d=vmData();const n=d.cards.length;if(!n)return;d.souls+=n*10;d.cards=[];save();render();toast(n+' kart parçalandı, +'+n*10+' harcanabilir Binek Ruhu (test)')}
const vmOldRender=render;render=function(){if(page==='Binek'&&state.class){document.body.classList.remove('valor-home');document.getElementById('gold').textContent=money(state.gold);document.getElementById('diamonds').textContent=money(state.diamonds);document.getElementById('level').textContent=state.level;nav();document.getElementById('main').innerHTML=vmMountPage();return}vmOldRender()};
const vmOldProfile=profile;profile=function(){const base=vmOldProfile(),win=vmBoard().winner;const tag=win.me?'<span class="vm-tag">✦ [Binek Tanrısı] ✦</span> ':'';return base.replace('<div class="vp-header"><strong>','<div class="vp-header"><strong>'+tag).replace('Ekipman bonusları takılı eşyalara göre hesaplanır.','Ekipman ve binek bonusları toplam istatistiklere dahildir.')};
const vmOldChat=chatPage;chatPage=function(){const w=vmBoard().winner;return vmOldChat()+'<div class="vm-chat"><b>💬 Sohbet TAG Önizlemesi</b><p>'+(w.me?'<span class="vm-tag">[Binek Tanrısı]</span> ':'')+'<b>'+escapeAttr(state.name||'Oyuncu')+':</b> Herkese iyi oyunlar!</p><p class="vm-lead">Gerçek zamanlı sohbet ve sunucu TAG doğrulaması henüz aktif değil.</p></div>'};
</script>

<script id="valor-equipment-gems-system-v1">
/* Taşların sayısal bonusları henüz belirlenmedi; bu aşama yuva ve tür kurallarını uygular. */
const veGemTypes=['Saldırı','Sihirli Saldırı','Defans','Sihirli Defans','Kritik','Bloke','Can'];
const veGemIcons=['⚔','✦','⬡','✧','✷','◈','♥'];
const veGemColors=['#e54747','#339df5','#36b866','#eac54b','#ad64ed','#34343e','#f2f2ef'];
function veGemValue(type,level){const n=Math.max(1,Math.min(10,Number(level)||1));return type==='Can'?500+(n-1)*250:(type==='Kritik'||type==='Bloke')?50*n:100+(n-1)*125}
function veGemStat(type){return ({'Saldırı':'Saldırı','Sihirli Saldırı':'Sihir','Defans':'Savunma','Sihirli Defans':'Sihir Savunma','Kritik':'Kritik','Bloke':'Bloke','Can':'Can'})[type]}
let veGemSelection=0,veGemLevel=1;
function veGemSlots(it){if(!it)return '';const gems=Array.isArray(it.gems)?it.gems:[];return '<div class="ve-gems"><div class="ve-gems-title">💎 Ekipman Taşları · '+gems.filter(Boolean).length+'/4</div><div class="ve-gem-grid">'+Array.from({length:4},(_,i)=>{const g=gems[i];return '<button type="button" class="ve-gem-slot '+(g?'filled':'')+'" style="--ve-gem-color:'+(g?veGemColors[veGemTypes.indexOf(g.type)]:'#eac278')+'" onclick="veOpenGem(\''+String(it.id)+'\','+i+')"><span class="ve-gem-symbol">'+(g?veGemIcons[veGemTypes.indexOf(g.type)]:'◇')+'</span><b>'+(g?g.type:'Boş Yuva')+'</b><small>'+(g?'Sv. '+g.level+' · +'+veGemValue(g.type,g.level):'Taş Tak')+'</small></button>'}).join('')+'</div></div>'}
function veFindItem(id){return (state.inventory||[]).find(x=>String(x.id)===String(id))||Object.values(state.equipped||{}).find(x=>x&&String(x.id)===String(id))}
function veAddToPopup(id,popupId){const it=veFindItem(id),box=document.getElementById(popupId);if(!it||!box)return;const dialog=box.querySelector('.valor-item-dialog');if(!dialog)return;const buttons=dialog.querySelector('.detail-buttons,.valor-item-remove');if(buttons)buttons.insertAdjacentHTML('beforebegin',veGemSlots(it));else dialog.insertAdjacentHTML('beforeend',veGemSlots(it))}
const veOldBagPopup=showBagItemPopup;
showBagItemPopup=function(n){veOldBagPopup(n);const it=state.inventory[n];if(it)veAddToPopup(it.id,'valor-bag-popup')};
const veOldProfileDetails=showProfileDetails;
showProfileDetails=function(slot){veOldProfileDetails(slot);const it=state.equipped[slot];if(it)veAddToPopup(it.id,'valor-item-overlay')};
function veOpenGem(id,slot){const it=veFindItem(id);if(!it||slot<0||slot>3)return;document.getElementById('ve-gem-overlay')?.remove();const gems=Array.isArray(it.gems)?it.gems:[],current=gems[slot];veGemSelection=current?veGemTypes.indexOf(current.type):0;veGemLevel=current?current.level:1;const used=new Set(gems.filter((g,i)=>g&&i!==slot).map(g=>g.type));const overlay=document.createElement('div');overlay.className='ve-gem-modal';overlay.id='ve-gem-overlay';overlay.innerHTML='<div class="ve-gem-dialog"><h3>💎 '+(slot+1)+'. Taş Yuvası</h3><p>'+escapeAttr(it.name)+' · Aynı tür taş bir ekipmana yalnızca bir kez takılabilir.</p><div class="ve-gem-types">'+veGemTypes.map((type,i)=>'<button type="button" '+(used.has(type)?'disabled':'')+' style="--ve-gem-color:'+veGemColors[i]+'" class="'+(veGemSelection===i?'active':'')+'" onclick="veSelectGem('+i+')">'+veGemIcons[i]+' '+type+(used.has(type)?' · Takılı':'')+'</button>').join('')+'</div><label for="ve-gem-level">Taş Seviyesi (1–10)</label><select id="ve-gem-level" onchange="veGemLevel=Number(this.value);veUpdateGemPreview()">'+Array.from({length:10},(_,i)=>'<option value="'+(i+1)+'" '+(veGemLevel===i+1?'selected':'')+'>Seviye '+(i+1)+'</option>').join('')+'</select><p>Test aşaması: Taş envanteri ve taşların verdiği sayısal bonuslar henüz tanımlanmadı.</p><div class="ve-gem-controls"><button onclick="veCloseGem()">Vazgeç</button>'+(current?'<button onclick="veRemoveGem(\''+String(id)+'\','+slot+')">Taşı Çıkar</button>':'')+'<button onclick="veSaveGem(\''+String(id)+'\','+slot+')">Taşı Tak</button></div></div>';overlay.addEventListener('click',e=>{if(e.target===overlay)veCloseGem()});document.body.appendChild(overlay)}
function veSelectGem(i){veGemSelection=i;document.querySelectorAll('#ve-gem-overlay .ve-gem-types button').forEach((b,j)=>b.classList.toggle('active',j===i));veUpdateGemPreview()}
function veUpdateGemPreview(){const el=document.getElementById('ve-gem-preview');if(el)el.textContent='Taş bonusu: +'+veGemValue(veGemTypes[veGemSelection],veGemLevel)+' '+veGemTypes[veGemSelection]}
function veCloseGem(){document.getElementById('ve-gem-overlay')?.remove()}
function veRefreshItemGem(id){veCloseGem();const bag=document.getElementById('valor-bag-popup'),prof=document.getElementById('valor-item-overlay');if(bag){const n=state.inventory.findIndex(x=>String(x.id)===String(id));if(n>=0)showBagItemPopup(n)}else if(prof){const slot=Object.keys(state.equipped).find(k=>state.equipped[k]&&String(state.equipped[k].id)===String(id));if(slot)showProfileDetails(slot)}render()}
function veSaveGem(id,slot){const it=veFindItem(id);if(!it)return;const type=veGemTypes[veGemSelection],level=Number(veGemLevel);if(!type||!Number.isInteger(level)||level<1||level>10)return toast('Geçersiz taş');if(!Array.isArray(it.gems))it.gems=[];if(it.gems.some((g,i)=>i!==slot&&g&&g.type===type))return toast('Bu taş türü zaten takılı!');it.gems[slot]={type,level};save();veRefreshItemGem(id);toast(type+' taşı takıldı (Sv. '+level+')')}
function veRemoveGem(id,slot){const it=veFindItem(id);if(!it||!Array.isArray(it.gems))return;it.gems[slot]=null;save();veRefreshItemGem(id);toast('Taş çıkarıldı')}
</script>

<script id="valor-workshop-v2">
/* Atölye: Güçlendirme, Mozaik, Arıtma (sonra), Epik, Birleştir, Şans Taşı */
let vwSelectedItemId=null;
function vwInit(){if(!Array.isArray(state.gemInventory)){state.gemInventory=veGemTypes.map(type=>({type,level:1,count:1}));save()}if(!Number.isFinite(state.mountSpiritFragments))state.mountSpiritFragments=0;if(!Array.isArray(state.mountCraftCards))state.mountCraftCards=[]}
function vwGemCount(type,level){vwInit();return state.gemInventory.filter(g=>g.type===type&&g.level===level).reduce((a,g)=>a+(Number(g.count)||0),0)}
function vwAddGem(type,level,qty){vwInit();let g=state.gemInventory.find(g=>g.type===type&&g.level===level);if(!g){g={type,level,count:0};state.gemInventory.push(g)}g.count+=qty;state.gemInventory=state.gemInventory.filter(g=>g.count>0)}
function vwGemBag(){vwInit();const gems=state.gemInventory.filter(g=>g.count>0);return '<div class="vw-gem-bag">'+(gems.length?gems.map(g=>{const i=veGemTypes.indexOf(g.type);return '<div class="vw-gem-chip" style="--ve-gem-color:'+veGemColors[i]+'"><b>◆ '+g.type+'</b><div>Sv. '+g.level+' · +'+veGemValue(g.type,g.level)+'</div><strong>Adet: '+g.count+'</strong></div>'}).join(''):'<p class="vw-muted">Çantanda taş bulunmuyor.</p>')+'</div>'}
function vwChooseItem(id){vwSelectedItemId=id;render()}
function vwItemPicker(items){return '<div class="vw-item-list">'+items.map(it=>'<button class="vw-item '+(String(vwSelectedItemId)===String(it.id)?'active':'')+'" onclick="vwChooseItem(\''+String(it.id)+'\')"><img src="'+equipmentIcon(it)+'" alt=""><div>'+escapeAttr(it.name)+'</div><b>+'+(it.plus||0)+'</b></button>').join('')+'</div>'}
function vwPanel(){vwInit();const items=[...(state.inventory||[]),...Object.values(state.equipped||{}).filter(Boolean)];let it=items.find(x=>String(x.id)===String(vwSelectedItemId));if(!it&&items.length){it=items[0];vwSelectedItemId=it.id}
const names={enhance:'Güçlendirme',mosaic:'Mozaik',refine:'Arıtma',epic:'Epik',combine:'Birleştir',stones:'Şans Taşı'};
let content='';
if(['enhance','mosaic','epic'].includes(workTab)){content='<p class="vw-muted">İşlem yapmak için ekipman seç.</p>'+vwItemPicker(items);if(it){if(workTab==='mosaic'){content+='<div class="vw-action"><h3>'+escapeAttr(it.name)+' · Mozaik</h3>'+veGemSlots(it)+'<p class="vw-muted">Taş yuvasına dokunarak çantandaki taşı tak veya çıkar. Aynı türden ikinci taş takılamaz.</p></div>'}else if(workTab==='enhance'){const cost=it.plus<21?costs[it.plus]:0;content+='<div class="vw-action"><h3>'+escapeAttr(it.name)+' +'+it.plus+'</h3><p>Başarı: %'+(it.plus<21?rates[it.plus]:0)+' · Altın: '+(it.plus<21?money(cost):'—')+'</p><label>Şans Taşı: <select id="stone-'+String(it.id).replace('.','_')+'"><option value="0">Yok</option>'+Array.from({length:8},(_,n)=>'<option value="'+(n+1)+'">Sv.'+(n+1)+' ('+(state.stones[n+1]||0)+')</option>').join('')+'</select></label><p><button '+(it.plus>=21||state.gold<cost?'disabled':'')+' onclick="enhance('+it.id+')">Güçlendir</button></p></div>'}else{content+='<div class="vw-action"><h3>'+escapeAttr(it.name)+'</h3><p>Epik Parçası: '+(it.level*2)+' · Mevcut: '+state.shards+'</p><button '+(it.epic||state.shards<it.level*2?'disabled':'')+' onclick="epic('+it.id+')">Epik Yap</button></div>'}}}
else if(workTab==='refine')content='<div class="vw-action"><h3>Arıtma</h3><p>Bu özellik sonraki güncellemede açılacak. Şimdilik ekipmanlara arıtma bonusu uygulanmaz.</p></div>';
else if(workTab==='combine')content='<div class="vw-action"><h3>🐎 Kazgan At Kartı</h3><p>Gereken: 100 Binek Ruh Parçası</p><p>Mevcut: '+state.mountSpiritFragments+' / 100</p><p>Üretilen kart: '+state.mountCraftCards.filter(x=>x==='kazgan').length+'</p><button '+(state.mountSpiritFragments<100?'disabled':'')+' onclick="vwCraftKazgan()">100 Parça ile Birleştir</button><p class="vw-muted">Binek Ruh Parçası, harcanabilir Binek Ruhundan ayrı bir malzemedir.</p></div>';
else if(workTab==='stones')content='<p class="vw-muted">Aynı seviyeden 2 Şans Taşı ve altın ile üst seviyeye birleştir.</p><div class="grid">'+Array.from({length:7},(_,n)=>{const v=n+1,c=2500+n*5000;return '<div class="card"><h3>Şans Taşı '+v+' → '+(v+1)+'</h3><p>Taş: '+(state.stones[v]||0)+' / 2 · Altın: '+money(c)+'</p><button '+(state.gold<c||(state.stones[v]||0)<2?'disabled':'')+' onclick="mergeStone('+v+')">Birleştir</button></div>'}).join('')+'</div>';
return '<div class="vw-shell"><details class="vw-top-dropdown"><summary>⚒ Atölye Menüsü <strong>'+names[workTab]+'</strong><span class="vw-chevron">▾</span></summary><nav class="vw-menu">'+[['enhance','⚒ Güçlendirme'],['mosaic','💎 Mozaik'],['refine','✧ Arıtma'],['epic','✦ Epik'],['combine','♞ Birleştir'],['stones','◈ Şans Taşı']].map(([k,label])=>'<button class="'+(workTab===k?'active':'')+'" onclick="workTab=\''+k+'\';render()">'+label+'</button>').join('')+'</nav></details><section class="vw-panel"><h2>'+names[workTab]+'</h2>'+content+'</section></div>'}
function vwCraftKazgan(){vwInit();if(state.mountSpiritFragments<100)return toast('Binek Ruh Parçası yetersiz');state.mountSpiritFragments-=100;state.mountCraftCards.push('kazgan');save();render();toast('Kazgan At Kartı oluşturuldu!')}
const vwOldWorkshop=workshop;workshop=function(){if(!['enhance','mosaic','refine','epic','combine','stones'].includes(workTab))workTab='enhance';return vwPanel()};
const vwOldBag=bag;bag=function(){vwInit();return vwOldBag()+'<div class="vw-bag-gems"><h3>💎 Taş Çantası</h3>'+vwGemBag()+'</div>'};
const vwOldGemOpen=veOpenGem;
veOpenGem=function(id,slot){if(page!=='Atölye'||workTab!=='mosaic'){page='Atölye';workTab='mosaic';vwSelectedItemId=id;render();toast('Taş takma işlemi Atölye → Mozaik bölümünde yapılır');return}vwOldGemOpen(id,slot);const dialog=document.querySelector('#ve-gem-overlay .ve-gem-dialog');if(dialog){const p=dialog.querySelector('p');if(p)p.textContent+=' · Taşlar çantadan tüketilir.';const old=dialog.querySelectorAll('p');if(old.length>1)old[old.length-1].textContent='Yalnızca çantanda bulunan taşları takabilirsin.'}}
const vwOldGemSave=veSaveGem;
veSaveGem=function(id,slot){const it=veFindItem(id);if(!it)return;const type=veGemTypes[veGemSelection],level=Number(veGemLevel),current=(it.gems||[])[slot];if(!type||!Number.isInteger(level)||level<1||level>10)return toast('Geçersiz taş');if((it.gems||[]).some((g,i)=>i!==slot&&g&&g.type===type))return toast('Bu taş türü zaten takılı');if(!current||current.type!==type||current.level!==level){if(vwGemCount(type,level)<1)return toast('Bu taş çantanda yok');vwAddGem(type,level,-1);if(current)vwAddGem(current.type,current.level,1)}vwOldGemSave(id,slot)};
const vwOldGemRemove=veRemoveGem;
veRemoveGem=function(id,slot){const it=veFindItem(id),g=it&&it.gems&&it.gems[slot];if(g)vwAddGem(g.type,g.level,1);vwOldGemRemove(id,slot)};
const vwOldGemRefresh=veRefreshItemGem;
veRefreshItemGem=function(id){veCloseGem();if(page==='Atölye'&&workTab==='mosaic'){render();return}vwOldGemRefresh(id)};
</script>

<script id="valor-gem-art-v2-script">
/* Şeffaf SVG mozaik taşları: aynı kristal silueti, seviyeye göre artan altın süsler. */
function vgArt(type,level){const index=veGemTypes.indexOf(type),n=Math.max(1,Math.min(10,Number(level)||1));if(index<0)return '';
const colors=[['#ff8982','#e92026','#7d0b15'],['#83dcff','#1586ff','#073b9e'],['#7bffb5','#16c96d','#075a39'],['#fff4a3','#ffc42d','#98600c'],['#eab1ff','#a73bea','#55118b'],['#b4b8c7','#34394b','#090b13'],['#ffffff','#dbe7f6','#8998b6']][index];
const a=colors[0],b=colors[1],c=colors[2],id='vg'+index+'x'+n;
const ring=n>=3?'<path d="M13 40 Q16 54 39 59 Q62 52 65 39" fill="none" stroke="#bd792c" stroke-width="'+(n>=7?4:2.5)+'"/><path d="M16 42 Q28 58 40 55 Q55 53 62 42" fill="none" stroke="#ffcf6b" stroke-width="1.5"/>':'';
const arms=n>=5?'<path d="M17 48 L7 36 L19 42 L24 54 M62 48 L72 36 L60 42 L55 54" fill="#9c601e" stroke="#ffd36d" stroke-width="1.4"/>':'';
const crown=n>=8?'<path d="M19 21 L10 13 L26 17 L40 5 L53 17 L70 13 L60 21" fill="none" stroke="#e5ad50" stroke-width="2.6"/>':'';
const aura=n>=6?'<ellipse cx="40" cy="37" rx="31" ry="31" fill="none" stroke="'+b+'" stroke-opacity=".25" stroke-width="3"/><path d="M8 20 L11 15 M69 23 L73 18 M18 64 L15 70 M61 63 L65 69" stroke="'+a+'" stroke-width="2"/>':'';
return '<span class="vg-icon" aria-label="'+type+' Seviye '+n+'"><svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="'+id+'" x1="0" x2=".9" y1="0" y2="1"><stop stop-color="'+a+'"/><stop offset=".48" stop-color="'+b+'"/><stop offset="1" stop-color="'+c+'"/></linearGradient></defs>'+aura+'<path d="M40 6 L60 25 L55 55 L37 70 L19 53 L21 27 Z" fill="url(#'+id+')" stroke="'+a+'" stroke-width="1.5"/><path d="M40 6 L39 38 L21 27 Z" fill="'+a+'" opacity=".75"/><path d="M40 6 L60 25 L39 38 Z" fill="'+b+'" opacity=".72"/><path d="M21 27 L39 38 L19 53 Z" fill="'+c+'" opacity=".72"/><path d="M60 25 L55 55 L39 38 Z" fill="'+c+'" opacity=".62"/><path d="M19 53 L39 38 L37 70 Z" fill="'+b+'" opacity=".65"/><path d="M55 55 L37 70 L39 38 Z" fill="'+a+'" opacity=".5"/><path d="M25 26 L39 11 L37 29" fill="none" stroke="#fff" stroke-opacity=".72" stroke-width="1.7"/>'+ring+arms+crown+'</svg></span>'}
/* Onaylanan 480x336 atlas: 10 sütun x 7 satır, her taş 48x48. */
const vgApprovedSpriteReady=true;
function vgApprovedTile(type,level){const row=veGemTypes.indexOf(type),col=Math.max(0,Math.min(9,(Number(level)||1)-1));if(row<0)return '';return '<span class="vg-sprite" style="background-position:'+(-col*48)+'px '+(-row*48)+'px"></span>'}
vgArt=function(type,level){return '<span class="vg-icon" role="img" aria-label="'+escapeAttr(type)+' Seviye '+Number(level)+'">'+vgApprovedTile(type,level)+'</span>'};
const vgOldInit=vwInit;
vwInit=function(){vgOldInit();if(!state.gemVisualTest70v1){state.gemVisualTest70v1=true;for(const type of veGemTypes)for(let level=1;level<=10;level++){let gem=state.gemInventory.find(g=>g.type===type&&g.level===level);if(gem)gem.count=(Number(gem.count)||0)+1;else state.gemInventory.push({type,level,count:1})}save()}}
vwGemBag=function(){vwInit();const gems=state.gemInventory.filter(g=>g.count>0).sort((a,b)=>veGemTypes.indexOf(a.type)-veGemTypes.indexOf(b.type)||a.level-b.level);return '<div class="vw-gem-bag">'+(gems.length?gems.map(g=>{const i=veGemTypes.indexOf(g.type);return '<div class="vw-gem-chip" style="--ve-gem-color:'+veGemColors[i]+'">'+vgArt(g.type,g.level)+'<div class="vg-meta"><b>'+g.type+'</b><div>Sv. '+g.level+' · +'+veGemValue(g.type,g.level)+'</div><strong>Adet: '+g.count+'</strong></div></div>'}).join(''):'<p class="vw-muted">Çantanda taş bulunmuyor.</p>')+'</div>'}
veGemSlots=function(it){if(!it)return '';const gems=Array.isArray(it.gems)?it.gems:[];return '<div class="ve-gems"><div class="ve-gems-title">💎 Ekipman Taşları · '+gems.filter(Boolean).length+'/4</div><div class="ve-gem-grid">'+Array.from({length:4},(_,i)=>{const g=gems[i];return '<button type="button" class="ve-gem-slot '+(g?'filled':'')+'" style="--ve-gem-color:'+(g?veGemColors[veGemTypes.indexOf(g.type)]:'#eac278')+'" onclick="veOpenGem(\''+String(it.id)+'\','+i+')">'+(g?vgArt(g.type,g.level):'<span class="ve-gem-symbol">◇</span>')+'<b>'+(g?g.type:'Boş Yuva')+'</b><small>'+(g?'Sv. '+g.level+' · +'+veGemValue(g.type,g.level):'Taş Tak')+'</small></button>'}).join('')+'</div></div>'}
const vgOldGemOpen=veOpenGem;
veOpenGem=function(id,slot){vgOldGemOpen(id,slot);const box=document.querySelector('#ve-gem-overlay .ve-gem-types');if(!box)return;box.querySelectorAll('button').forEach((button,i)=>{button.innerHTML=vgArt(veGemTypes[i],veGemLevel)+'<span>'+veGemTypes[i]+'</span>'})}
</script>

<script id="valor-progress-systems-js">
const vsIcons=['⚔️','🔮','🛡️','✨','🎯','🛡️','❤️'];
const vsNames=['Saldırı','Sihirli Saldırı','Defans','Sihirli Defans','Kritik','Bloke','Can'],vsKeys=['Saldırı','Sihir','Savunma','Sihir Savunma','Kritik','Bloke','Can'],vsSteps=[200,200,200,200,50,50,400];
function vsToday(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Istanbul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function vsData(){if(!state.valorSystems){state.valorSystems={tech:Array(7).fill(0),crystals:0,plots:Array(9).fill(0),dungeon:{day:'',cleared:0,best:0,coins:0}};save()}const d=state.valorSystems;if(d.dungeon.day!==vsToday()){d.dungeon.day=vsToday();d.dungeon.cleared=0;save()}return d}
function vsTechBonus(){const d=vsData(),out={};vsKeys.forEach((k,i)=>out[k]=(out[k]||0)+d.tech[i]*vsSteps[i]);return out}
function vsTechnology(){const d=vsData();return '<div class="vsys"><h2>🔮 Teknoloji</h2><p class="vsys-muted">💠 Kristal: '+d.crystals+' · Kristaller yalnızca çiftlik hasadından kazanılır. Geliştirme bedeli şimdilik 1 kristal.</p><div class="vsys-grid">'+vsNames.map((n,i)=>'<div class="vsys-card"><h3><span class="vsys-stat-icon" data-vi="'+(i+1)+'">'+''+'</span>'+n+'</h3><p>Seviye '+d.tech[i]+'/100 · Bonus +'+money(d.tech[i]*vsSteps[i])+'</p><div class="vsys-bar"><span style="width:'+d.tech[i]+'%"></span></div><p>Her seviye +'+vsSteps[i]+'</p><button '+(d.tech[i]>=100||d.crystals<1?'disabled':'')+' onclick="vsUpgrade('+i+')">Geliştir · 1 Kristal</button></div>').join('')+'</div></div>'}
function vsUpgrade(i){const d=vsData();if(i<0||i>6||d.tech[i]>=100)return;if(d.crystals<1)return toast('Kristal yetersiz');d.crystals--;d.tech[i]++;save();render();toast(vsNames[i]+' geliştirildi')}
function vsFarm(){const d=vsData(),open=Math.min(9,3+Math.floor(state.level/5)),now=Date.now();return '<div class="vsys"><h2>🌱 Kristal Çiftliği</h2><p class="vsys-muted">💠 Kristal: '+d.crystals+' · Açık tarla: '+open+'/9. Ücretsiz tohum ek, 10 dakika sonra 1 kristal hasat et. Diğer tarlalar 5 seviyede bir açılır.</p><div class="vsys-plots">'+d.plots.map((time,i)=>{const ready=time&&now-time>=600000;return '<div class="vsys-card"><h3>'+(i<open?'🌱':'🔒')+' Tarla '+(i+1)+'</h3><p>'+(i>=open?'Sv. '+((i-2)*5)+' gerekli':!time?'Boş tarla':ready?'Kristal hazır':'Büyüyor · '+Math.ceil((600000-(now-time))/60000)+' dk')+'</p>'+(i<open?'<button '+(time&&!ready?'disabled':'')+' onclick="vsHarvest('+i+')">'+(!time?'Tohum Ek':ready?'Hasat Et':'Büyüyor')+'</button>':'')+'</div>'}).join('')+'</div></div>'}
function vsHarvest(i){const d=vsData();if(i<0||i>=Math.min(9,3+Math.floor(state.level/5)))return;const t=d.plots[i];if(!t){d.plots[i]=Date.now();toast('Tohum ekildi')}else if(Date.now()-t>=600000){d.plots[i]=0;d.crystals++;toast('+1 kristal')}else return;save();render()}
function vsBoss(f){const a=['Kül','Ayaz','Gölge','Kan','Fırtına','Kadim','Gece','Lanet','Yıldırım','Uçurum'],b=['Muhafızı','Ejderi','Celladı','Golemi','Şövalyesi','Cadısı','Devi','Yırtıcısı','Hükümdarı','Ruhu'];return a[Math.floor((f-1)/10)]+' '+b[(f-1)%10]}
function vsEnemy(f){return 60+f*13+(f%5===0?100+f*8:0)}
function vsPower(){const t=vsTechBonus(),m=vmDerived();return totalPower()+state.level*14+40+Math.round(((t.Saldırı||0)+(t.Sihir||0)+(m.Saldırı||0)+(m.Sihir||0))/8)}
function vsDungeon(){const d=vsData().dungeon,f=d.cleared+1,poison=f%5===0;return '<div class="vsys"><h2>🏰 Zindan · 100 Kat</h2><p class="vsys-muted">Bugün: '+d.cleared+'/100 · En yüksek: '+d.best+'/100 · Zindan Parası: '+d.coins+'</p><p class="vsys-muted">Her gün Türkiye saatiyle 00.00’da sıfırlanır. Her 5. kat zehirli ve güçlü boss içerir; yalnızca bu katlardan mozaik taşı ve kat/5 kadar zindan parası kazanılır.</p><div class="vsys-card"><h3>'+(f>100?'🏆 Tüm katlar tamamlandı':'Kat '+f+' · '+vsBoss(f))+'</h3>'+(f>100?'':('<p>'+(poison?'☠ Zehirli Boss':'Normal Boss')+' · Boss gücü: '+vsEnemy(f)+' · Senin gücün: '+vsPower()+'</p><p>Ödül: '+(f*30)+' EXP'+(poison?' · Rastgele Sv. '+(f<=30?'1–2':f<=60?'2–3':'3–4')+' mozaik taşı · '+(f/5)+' zindan parası':'')+'</p><button onclick="vsFight()">Boss ile Savaş</button>'))+'</div><div class="vsys-card" style="margin-top:10px"><h3>⚡ Baskın</h3><p>Önceden geçtiğin katları yeniden hızlı geç. Bedel: 1.000.000 altın.</p><button '+(d.best<=d.cleared||state.gold<1000000?'disabled':'')+' onclick="vsRaid()">Baskın Yap</button></div><div class="vsys-floors">'+Array.from({length:100},(_,i)=>'<span class="'+(i<d.cleared?'passed ':'')+((i+1)%5===0?'poison':'')+'" title="'+vsBoss(i+1)+'">'+(i+1)+'</span>').join('')+'</div></div>'}
function vsReward(f){earnXP(f*30);if(f%5===0){const type=veGemTypes[Math.floor(Math.random()*veGemTypes.length)],level=f<=30?1+Math.floor(Math.random()*2):f<=60?2+Math.floor(Math.random()*2):3+Math.floor(Math.random()*2);vwAddGem(type,level,1);vsData().dungeon.coins+=f/5}}
function vsFight(){const d=vsData().dungeon,f=d.cleared+1;if(f>100)return;const enemy=vsEnemy(f),chance=Math.max(.12,Math.min(.98,.76+(vsPower()-enemy)/Math.max(300,enemy)));if(Math.random()>chance)return toast('Boss savaşı kaybedildi');d.cleared=f;d.best=Math.max(d.best,f);vsReward(f);save();render();toast('Kat '+f+' geçildi! Ödüller alındı')}
function vsRaid(){const d=vsData().dungeon,target=Math.min(100,d.best);if(d.cleared>=target||state.gold<1000000)return;state.gold-=1000000;for(let f=d.cleared+1;f<=target;f++)vsReward(f);d.cleared=target;save();render();toast('Baskın tamamlandı!')}

render=function(){if(state.class&&['Teknoloji','Çiftlik','Zindan'].includes(page)){document.body.classList.remove('valor-home');document.getElementById('gold').textContent=money(state.gold);document.getElementById('diamonds').textContent=money(state.diamonds);document.getElementById('level').textContent=state.level;nav();document.getElementById('main').innerHTML=page==='Teknoloji'?vsTechnology():page==='Çiftlik'?vsFarm():vsDungeon();return}vsOldRender()};

profile=function(){const html=vsOldProfile(),tech=vsTechBonus();return html.replace(/(<div class="vp-stat"><span>)(Saldırı|Sihir|Savunma|Sihir Savunma|Kritik|Bloke|Can)(<\/span><b>)([0-9]+)(<\/b><\/div>)/g,(all,a,k,b,n,c)=>a+k+b+(Number(n)+(tech[k]||0))+c)};

function vaGoldData(){const d=vsData();if(!d.goldProduction){d.goldProduction={level:0,lastTick:Date.now(),fraction:0,total:0};save()}return d.goldProduction}
function vaGoldCollect(){if(!state.class)return 0;const g=vaGoldData(),now=Date.now(),last=Number(g.lastTick)||now,elapsed=Math.max(0,Math.min(now-last,365*24*60*60*1000));g.lastTick=now;if(g.level<=0)return 0;const produced=elapsed*g.level*100/60000+(Number(g.fraction)||0);const amount=Math.floor(produced);g.fraction=produced-amount;if(amount){state.gold+=amount;g.total=(Number(g.total)||0)+amount}return amount}
function vaGoldUpgrade(){vaGoldCollect();const d=vsData(),g=vaGoldData();if(g.level>=100)return toast('Altın Üretimi maksimum seviyede');if(d.crystals<1)return toast('Kristal yetersiz, çiftlikten kazanabilirsin');d.crystals--;g.level++;save();render();toast('Altın Üretimi Sv. '+g.level+' · +'+money(g.level*100)+' altın/dk')}

const vaOldRender=render;
render=function(){if(state.class){const earned=vaGoldCollect();if(earned)save()}vaOldRender()};
if(state.class){vaGoldCollect();save()}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&state.class){vaGoldCollect();save();render()}else if(state.class){vaGoldCollect();save()}});
setInterval(function(){if(!state.class||document.hidden)return;const gained=vaGoldCollect();if(gained){save();const el=document.getElementById('gold');if(el)el.textContent=money(state.gold);if(page==='Teknoloji')render()}},15000);
</script>

</script><style id="valor-affix-v1-style">
.va-affixes{margin:12px 0;padding:10px;border:1px solid #a57b43;border-radius:8px;background:#211b19;color:#f7e2b7}.va-affixes h4{margin:0 0 9px;color:#f7c879}.va-affix{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid #ffffff15;font-size:12px}.va-affix:last-child{border:0}.va-stars{color:#ffc94b;font-size:12px;letter-spacing:1px}.va-affix small{color:#e8c995}.va-refine-help{font-size:12px;color:#dbc5a4;line-height:1.5}.va-refine-btn{width:100%;margin-top:10px}

<script id="valor-affix-v1-js">
/* 5 benzersiz efsun; arıtma aynı ekipmanın beş efsununu yeniden belirler. */
const vaAffixPool=['Saldırı','Sihirli Saldırı','Defans','Sihirli Defans','Kritik','Bloke','Can','Güç','Zeka','Zırh','Beden'];
const vaAffixBase={Güç:10,Zeka:10,Zırh:10,Beden:10};
const vaRefineCost=1000;
function vaRollAffixes(){const pool=vaAffixPool.slice(),out=[];for(let i=0;i<5;i++){const j=Math.floor(Math.random()*pool.length);out.push({type:pool.splice(j,1)[0],stars:1+Math.floor(Math.random()*10)})}return out}
function vaEnsureAffixes(it){if(!it)return [];if(!Array.isArray(it.affixes)||it.affixes.length!==5||it.affixes.some(a=>!a||!vaAffixPool.includes(a.type)||a.stars<1||a.stars>10)){it.affixes=vaRollAffixes();save()}return it.affixes}
function vaAffixValue(a){return a.stars*(vaAffixBase[a.type]||25)}
function vaAffixMarkup(it){return '<div class="va-affixes"><h4>✦ Ekipman Efsunları · 5/5</h4>'+vaEnsureAffixes(it).map(a=>'<div class="va-affix"><span>'+escapeAttr(a.type)+'</span><span><span class="va-stars">'+(a.stars+'⭐')+'</span> <small>+'+vaAffixValue(a)+'</small></span></div>').join('')+'</div>'}
function vaAffixBonuses(){const out={Saldırı:0,Sihir:0,Savunma:0,'Sihir Savunma':0,Kritik:0,Bloke:0,Can:0};for(const it of Object.values(state.equipped||{})){if(!it)continue;for(const a of vaEnsureAffixes(it)){const v=vaAffixValue(a);switch(a.type){case 'Saldırı':out.Saldırı+=v;break;case 'Sihirli Saldırı':out.Sihir+=v;break;case 'Defans':out.Savunma+=v;break;case 'Sihirli Defans':out['Sihir Savunma']+=v;break;case 'Kritik':out.Kritik+=v;break;case 'Bloke':out.Bloke+=v;break;case 'Can':out.Can+=v;break;case 'Güç':out.Saldırı+=v*4;break;case 'Zeka':out.Sihir+=v*4;break;case 'Zırh':out.Savunma+=v*4;out['Sihir Savunma']+=v*4;break;case 'Beden':out.Can+=v*40;break}}}return out}
const vaOldItem=item;
item=function(){const it=vaOldItem.apply(this,arguments);it.affixes=vaRollAffixes();return it};
const vaOldEquipmentBonuses=equipmentBonuses;
equipmentBonuses=function(){const out=vaOldEquipmentBonuses();const aff=vaAffixBonuses();for(const k of Object.keys(aff))out[k]=(out[k]||0)+aff[k];return out};
const vaOldWorkshopPanel=vwPanel;
vwPanel=function(){let html=vaOldWorkshopPanel();if(workTab!=='refine')return html;const items=[...(state.inventory||[]),...Object.values(state.equipped||{}).filter(Boolean)];let it=items.find(x=>String(x.id)===String(vwSelectedItemId));if(!it&&items.length){it=items[0];vwSelectedItemId=it.id}const content='<p class="va-refine-help">Arıtma, seçilen ekipmanın 5 efsununu yeniden rastgele belirler. Her efsun 1–10 yıldızdır. Güç, Zeka, Zırh, Beden: yıldız × 10; diğerleri: yıldız × 25. İşlem bedeli: '+money(vaRefineCost)+' altın.</p>'+vwItemPicker(items)+(it?'<div class="vw-action"><h3>'+escapeAttr(it.name)+'</h3>'+vaAffixMarkup(it)+'<button class="va-refine-btn" '+(state.gold<vaRefineCost?'disabled':'')+' onclick="vaRefineSelected()">✦ Arıt · '+money(vaRefineCost)+' Altın</button></div>':'<p>Arıtılacak ekipman bulunamadı.</p>');return html.replace(/<div class="vw-action"><h3>Arıtma<\/h3><p>Bu özellik sonraki güncellemede açılacak\. Şimdilik ekipmanlara arıtma bonusu uygulanmaz\.<\/p><\/div>/,content)};
function vaRefineSelected(){const it=veFindItem(vwSelectedItemId);if(!it)return toast('Ekipman seç');if(state.gold<vaRefineCost)return toast('Yetersiz altın');state.gold-=vaRefineCost;it.affixes=vaRollAffixes();save();render();toast('Ekipmanın 5 efsunu yeniden belirlendi!')}
const vaOldBagPopup=showBagItemPopup;
showBagItemPopup=function(n){vaOldBagPopup(n);const it=state.inventory[n],box=document.getElementById('valor-bag-popup');if(it&&box){const d=box.querySelector('.valor-item-dialog');if(d)d.insertAdjacentHTML('beforeend',vaAffixMarkup(it))}};
const vaOldProfilePopup=showProfileDetails;
showProfileDetails=function(slot){vaOldProfilePopup(slot);const it=state.equipped[slot],box=document.getElementById('valor-item-overlay');if(it&&box){const d=box.querySelector('.valor-item-dialog');if(d)d.insertAdjacentHTML('beforeend',vaAffixMarkup(it))}};
for(const it of [...(state.inventory||[]),...Object.values(state.equipped||{}).filter(Boolean)])vaEnsureAffixes(it);
</script><style id="valor-workshop-top-dropdown-v1">
