function valorRepairEquipmentIds(){

let bossAttacking=false,bossView='battle',bossLastHit=0,bossCritical=false;
function bossSchedule(){
 const now=Date.now(),d=new Date(),ymd=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
 for(const h of [10,20]){const start=new Date(d.getFullYear(),d.getMonth(),d.getDate(),h).getTime();if(now>=start&&now<start+900000)return {active:true,id:ymd+'-'+h,end:start+900000};}
 const next=[10,20].map(h=>new Date(d.getFullYear(),d.getMonth(),d.getDate(),h).getTime()).find(t=>t>now)||new Date(d.getFullYear(),d.getMonth(),d.getDate()+1,10).getTime();
 return {active:true,id:ymd+'-test',end:now+900000,test:true,next};
}
/* World boss pays 1% of total damage as gold. */
const VALOR_BOSS_GOLD_RATE=.01;
function bossStore(){return state.worldBoss||(state.worldBoss={sessions:{},pending:[]})}
function bossSession(id){const store=bossStore();return store.sessions[id]||(store.sessions[id]={damage:0,hits:0,crits:0,paid:false})}
function bossSettle(){
 if(!state.class)return;
 const store=bossStore();
 for(const [id,s] of Object.entries(store.sessions)){
  if(s.paid)continue;
  const m=id.match(/^(\\d{4})-(\\d{2})-(\\d{2})-(10|20)$/);if(!m)continue;
  if(Date.now()<new Date(+m[1],+m[2]-1,+m[3],+m[4],15).getTime())continue;
  s.paid=true;s.reward=Math.floor(s.damage*VALOR_BOSS_GOLD_RATE);s.bonus=0;
  if(s.hits){state.gold+=s.reward;store.pending.push(id);}
  save();
 }
}
function bossPage(){
 bossSettle();const store=bossStore(),w=bossSchedule(),e=w.active?bossSession(w.id):null;
 if(store.pending.length){
 const id=store.pending[0],r=store.sessions[id];
 return '<div class="wb-wrap"><h1>🏆 BOSS SAVAŞI SONA ERDİ!</h1><div class="wb-card"><p>Verdiğin toplam hasar</p><h2>'+money(r.damage)+'</h2><p>Kazandığın altın</p><h2 style="color:#e4b967">🪙 '+money(r.reward)+'</h2></div><button onclick="bossClaim()">Ödülü Al</button></div>';
 }
 const seconds=w.active?Math.max(0,Math.ceil((w.end-Date.now())/1000)):0;
 const timer=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');
 return '<div class="wb-wrap"><div class="wb-title"><b>☠️ DÜNYA BOSSU · TEST</b><b>'+(w.active?timer:'KAPALI')+'</b></div><div class="wb-art"><img class="wb-demon" src="assets/images/boss_art.webp" alt="Kadimlerin Efendisi şeytani dünya bossu"><h2>KADİMLERİN EFENDİSİ</h2><p>∞ SINIRSIZ CAN</p></div><div class="wb-card wb-ranking"><h3>🏆 Hasar Sıralaması</h3><div class="wb-rank-row"><span>1. Sen</span><strong>'+money(e?.damage||0)+' hasar</strong></div><p class="small">Şimdilik yalnızca kendi hasarın görüntüleniyor. Diğer oyuncular için ortak sunucu gerekiyor.</p></div><button '+(!w.active?'disabled':'')+' onclick="bossAttacking=!bossAttacking;render()">'+(bossAttacking?'⏸ Saldırıyı Durdur':'⚔️ Saldırıyı Başlat')+'</button><p class="small">Etkinlik bitince verdiğin toplam hasarın %'+Math.round(VALOR_BOSS_GOLD_RATE*100)+' kadarı altın olarak verilir.</p><p class="small">'+(w.active?'Her saniye otomatik vuruş. Ekrandan çıkınca saldırı durur.':'Sonraki etkinlik: '+new Date(w.next).toLocaleString('tr-TR'))+'</p></div>';
}
function bossClaim(){bossStore().pending.shift();save();render()}
function bossTick(){
 if(!state.class)return;
 const w=bossSchedule();
 if(!w.active)bossAttacking=false;
 bossSettle();
 if(!bossAttacking||page!=='Dünya Bossu'||document.hidden)return;
 const e=bossSession(w.id);
 const base=Math.max(1,Math.round(combatPower()+state.level*4));
 const crit=Math.random()<Math.min(1,Math.max(0,(state.stats.Kritik||0)+250)/5000);
 const hit=Math.round(base*(crit?2:1));
 e.damage+=hit;e.hits++;if(typeof valorQuestRecord==='function')valorQuestRecord('boss');if(crit)e.crits++;
 bossLastHit=hit;bossCritical=crit;save();
}

function profile(){const cls=classes.indexOf(state.class);const image=heroImages[Math.max(0,cls)];const positions=['Silah','Zırh','Kask','Ayakkabı','Kolye','Küpe'];const tile=(slot)=>{const it=state.equipped[slot];return `<button type="button" class="vp-slot ${it?.epic?'is-epic':''}" onclick="profileItem(event,'${slot}')" title="${slot}${it?' — '+escapeAttr(it.name):''}">${it?`<img src="${equipmentIcon(it)}" alt="${slot}">`:`<span class="vp-empty">${icons[slot]}</span>`}${it?`<span class="vp-plus-badge">+${it.plus||0}</span>`:''}</button>`};return `<div class="vp-wrap"><div class="vp-header"><strong>${escapeAttr(state.name)}</strong><span>${state.class} · Sv. ${state.level}</span></div><div class="vp-scene"><div class="vp-hero"><img src="${image}" alt="${state.class} karakteri"></div><div class="vp-gear vp-left">${positions.slice(0,3).map(tile).join('')}</div><div class="vp-gear vp-right">${positions.slice(3).map(tile).join('')}</div></div><div class="vp-stats"><h2>Karakter İstatistikleri</h2><div class="vp-statgrid"><div class="vp-stat"><span>Seviye</span><b>${state.level} / 100</b></div><div class="vp-stat"><span>Deneyim</span><b>${state.level>=100?money(state.xp||0)+' EXP':state.xp+' / '+valorXpNeed(state.level)}</b></div><div class="vp-stat"><span>Dağıtılabilir Puan</span><b>${state.statPoints}</b></div>${dragonRegistered()?`<div class="vp-stat"><span>🐉 Binek Gücü</span><b>+100</b></div><div class="vp-stat"><span>🐉 Binek Zekası</span><b>+100</b></div><div class="vp-stat"><span>🐉 Binek Zırhı</span><b>+100</b></div><div class="vp-stat"><span>🐉 Binek Bedeni</span><b>+100</b></div>`:""}${Object.keys(state.stats).map(k=>`<div class="vp-stat"><span>${k}</span><b>${state.stats[k]} ${state.statPoints?`<button class="vp-plus" onclick="addStat('${k}')">+</button>`:''}</b></div>`).join('')}</div><div class="vp-exp"><div style="width:${Math.min(100,state.xp/valorXpNeed(state.level)*100)}%"></div></div><p class="vp-hint">Tek tık: eşya bilgileri · Çift tık: ekipmanı çıkar.</p let workshopSelectedId=null;function workshop(){let items=[...new Map([...state.inventory.filter(i=>i.slot!=='Binek'&&i.slot!=='Kanat'&&i.slot!=='Madalyon'&&i.slot!=='Fashion'),...Object.values(state.equipped).filter(i=>i&&i.slot!=='Kanat'&&i.slot!=='Madalyon')].map(i=>[i.id,i])).values()].sort((a,b)=>Number(Object.values(state.equipped||{}).some(e=>e&&String(e.id)===String(b.id)))-Number(Object.values(state.equipped||{}).some(e=>e&&String(e.id)===String(a.id))));return `<h1>🔨 Atölye</h1><div class="tabs"><button onclick="workTab='enhance';render()">Ekipman Geliştirme</button><button onclick="workTab='stones';render()">Şans Taşı Birleştirme</button><button onclick="workTab='epic';render()">Epik Yükseltme</button></div>${workTab==='stones'?`<p>Aynı seviyeden 2 Şans Taşı + altın → 1 üst seviye Şans Taşı. Başarı %100.</p><div class="grid">${Array.from({length:7},(_,n)=>{let s=n+1,c=2500+n*5000;return `<div class="card"><h3>💎 Sv.${s} → Sv.${s+1}</h3><p>Taş: ${state.stones[s]||0} / 2</p><p>Altın: ${money(c)}</p><button ${state.gold<c||(state.stones[s]||0)<2?'disabled':''} onclick="mergeStone(${s})">Birleştir</button></div>`}).join('')}</div>`:`<p class="muted">Çantandaki ve kuşandığın eşyalar burada görünür.</p><div class="workshop-item-grid">${items.map(i=>`<button type="button" class="workshop-item-tile ${workshopSelectedId===i.id?'selected':''}" onclick="workshopSelectedId=${i.id};render()"><img class="equipment-art" src="${equipmentIcon(i)}" alt="${i.slot}"><span>${i.name}</span><small>+${i.plus||0}${i.epic?' · Epik':''}</small></button>`).join('')}</div>${(()=>{const i=items.find(x=>x.id===workshopSelectedId);return i?`<div class="card workshop-selected"><div class="item"><img class="equipment-art" src="${equipmentIcon(i)}" alt="${i.slot}"><div><b>${i.name} +${i.plus||0}</b><div class="small">${i.epic?'✨ Epik • ':''}Güç ${equipmentPower(i)}</div></div></div>${workTab==='enhance'?`<p>Başarı: %${i.plus<21?rates[i.plus]:0} • Altın: ${i.plus<21?money(costs[i.plus]):'—'}</p><div class="formrow"><label>Şans Taşı:</label><select id="stone-${String(i.id).replace('.','_')}"><option value="0">Yok</option>${Array.from({length:8},(_,n)=>`<option value="${n+1}">Sv.${n+1} (${state.stones[n+1]||0})</option>`).join('')}</select></div><button ${i.plus>=21||state.gold<costs[i.plus]?'disabled':''} onclick="enhance(${i.id})">Geliştir</button>`:`<p>Gerekli Epik Taşı: ${i.level*2} • Mevcut: ${state.shards}</p><button ${i.epic||state.shards<i.level*2?'disabled':''} onclick="epic(${i.id})">Epik Yap (%100)</button>`}</div>`:'<p class="muted">İşlem yapmak için yukarıdan bir eşya seç.</p>'})()}`}`}function getItem(id){return [...state.inventory,...Object.values(state.equipped)].find(i=>i.id===id)}function enhance(id){let i=getItem(id);if(!i||i.plus>=21)return;let st=Number(document.getElementById('stone-'+String(i.id).replace('.','_')).value),cost=costs[i.plus];if(state.gold<cost)return toast('Altın yetersiz');if(st&&!(state.stones[st]>0))return toast('Şans Taşı yetersiz');state.gold-=cost;if(typeof valorQuestRecord==='function')valorQuestRecord('enhance');if(st)state.stones[st]--;let chance=Math.min(100,rates[i.plus]+st*10);if(Math.random()*100<chance){i.plus++;toast('Geliştirme başarılı! +'+i.plus)}else toast('Geliştirme başarısız. Seviye korunuyor.');save();render()}function mergeStone(s){let c=2500+(s-1)*5000;if(state.gold<c||(state.stones[s]||0)<2)return;state.gold-=c;state.stones[s]-=2;state.stones[s+1]=(state.stones[s+1]||0)+1;save();render();toast('Sv.'+(s+1)+' Şans Taşı üretildi')}function epic(id){let i=getItem(id);if(!i||i.epic||state.shards<i.level*2)return;state.shards-=i.level*2;i.epic=true;save();render();toast('Ekipman Epik oldu!')}

 if(!state || !state.class || state.valorAllSetsTestV1)return;

 const slotsToAdd=['Silah','Zırh','Kask','Ayakkabı','Kolye','Küpe'];

function valorEquipmentBaseStats(it,power=equipmentPower(it),slot=it?.slot){
 if(!it||it.wingId||it.marketItemId)return {};
 const p=Math.max(0,Math.floor(Number(power)||0)),attack=(it.cls||state.class)==='Büyücü'?'Sihir':'Saldırı';
 if(slot==='Silah'||slot==='Küpe')return {[attack]:p};
 if(slot==='Zırh'||slot==='Kask'){const defense=Math.floor(p/2);return {Savunma:defense,'Sihir Savunma':p-defense}}
 if(slot==='Kolye')return {Can:p};
 if(slot==='Ayakkabı')return {Savunma:Math.floor(p*.5),Bloke:Math.floor(p*.2)};
 return {};
}
function valorEquipmentStatLabel(stat){return ({Sihir:'Sihirli Saldırı',Savunma:'Defans','Sihir Savunma':'Sihirli Defans'})[stat]||stat}
function valorEquipmentStatsMarkup(it,power=equipmentPower(it)){return Object.entries(valorEquipmentBaseStats(it,power)).map(([stat,value])=>'<div><span>'+valorEquipmentStatLabel(stat)+'</span><strong>+'+money(value)+'</strong></div>').join('')}
function valorEquipmentStatsText(it,power=equipmentPower(it)){return Object.entries(valorEquipmentBaseStats(it,power)).map(([stat,value])=>valorEquipmentStatLabel(stat)+' +'+money(value)).join(' · ')}
function equipmentBonuses(){const out={Saldırı:0,Sihir:0,Savunma:0,'Sihir Savunma':0,Can:0,Kritik:0,Bloke:0};for(const [slot,it] of Object.entries(state.equipped||{})){if(!it||it.wingId||slot==='Kanat')continue;for(const [stat,value] of Object.entries(valorEquipmentBaseStats(it,equipmentPower(it),slot)))out[stat]+=value;const seen=new Set();for(const gem of (Array.isArray(it.gems)?it.gems:[]).slice(0,4)){if(!gem||seen.has(gem.type)||!veGemTypes.includes(gem.type))continue;seen.add(gem.type);const stat=veGemStat(gem.type);if(stat)out[stat]+=veGemValue(gem.type,gem.level)}}return out}

<script id="valor-mount-system-v1">

const valorMounts=[

{id:'ormanmuhafizi',name:'Orman Muhafızı',kind:'stag',color:'#74c28c',stats:[10,10,10,10],spirit:50}
,
{id:'geceyelesi',name:'Gece Yelesi',kind:'horse',color:'#7775ba',stats:[10,10,10,10],spirit:50,price:150000},
{id:'kizilpençe',name:'Kızıl Pençe',kind:'wolf',color:'#c86b51',stats:[20,20,20,20],spirit:100,price:300000},
{id:'firtinakanat',name:'Fırtına Kanat',kind:'griffin',color:'#7db3d9',stats:[20,20,20,20],spirit:100,price:600000},
{id:'golgegeyik',name:'Gölge Geyiği',kind:'stag',color:'#668c84',stats:[30,30,30,30],spirit:150,price:1000000},
{id:'obsidyenboynuz',name:'Obsidyen Boynuz',kind:'dragon',color:'#a179bd',stats:[30,30,30,30],spirit:150,price:1800000},
{id:'ayisigi',name:'Ay Işığı',kind:'horse',color:'#a9c8df',stats:[40,40,40,40],spirit:200,price:3500000},
{id:'atesgrifonu',name:'Ateş Grifonu',kind:'griffin',color:'#db8d4c',stats:[50,50,50,50],spirit:250,price:6000000},
{id:'kadimejder',name:'Kadim Ejder',kind:'dragon',color:'#d5b16b',stats:[80,80,80,80],spirit:400,price:12000000},
{id:'yildonumu30',name:'Yıldönümü Bineği · 30',kind:'horse',color:'#d9b66d',stats:[30,30,30,30],spirit:150,boxOnly:true},
{id:'yildonumu50',name:'Yıldönümü Bineği · 50',kind:'griffin',color:'#e7d29b',stats:[50,50,50,50],spirit:250,boxOnly:true}
];
function vmData(){if(!state.mountsV1){state.mountsV1={owned:valorMounts.filter(x=>x.id!=='threeDragon'&&!x.price&&!x.boxOnly).map(x=>x.id),cards:[],souls:0,temporary:[]};save()}const d=state.mountsV1;if(!d.training){d.training=Array.from({length:4},()=>({level:0,xp:0}));d.stones=100;save()}if(!d.bonus200v1){d.stones=(Number(d.stones)||0)+200;d.bonus200v1=true;save()}if(!d.bonus99999v1){d.stones=(Number(d.stones)||0)+99999;d.bonus99999v1=true;save()}if(Number(d.stones)>0){const count=Math.floor(Number(d.stones)),stack=state.inventory.find(it=>it.marketItemId==='mountStone');if(stack)stack.count=(Number(stack.count)||1)+count;else state.inventory.push({id:valorUniqueItemId(),slot:'Eşya',marketItemId:'mountStone',name:'Binek Taşı',count:count});d.stones=0;save()}return d}
function vmActive(){const d=vmData();return [...valorMounts.filter(m=>m.id==='threeDragon'?dragonRegistered():d.owned.includes(m.id)),...d.temporary.filter(t=>t.until>Date.now()).map(t=>valorMounts.find(m=>m.id===t.id)).filter(Boolean)]}
function vmSpirit(m){return Math.round((m.stats||[]).reduce((sum,v)=>sum+(Number(v)||0),0)*1.25)}
function vmTotals(){const mounts=vmActive();return mounts.reduce((a,m)=>{m.stats.forEach((v,i)=>a.stats[i]+=v);a.spirit+=vmSpirit(m);return a},{stats:[0,0,0,0],spirit:0})}
function vmDerived(){const a=vmTotals().stats.map((v,i)=>v+vmData().training[i].level*5);return {Saldırı:a[0]*4,Sihir:a[1]*4,Savunma:a[2]*4,'Sihir Savunma':a[2]*4,Can:a[0]+a[1]+a[3]*40}}
function vmMountStoneCount(){return state.inventory.filter(it=>it.marketItemId==='mountStone').reduce((sum,it)=>sum+(Number(it.count)||1),0)}
function vmSpendMountStones(amount){for(let n=state.inventory.length-1;n>=0&&amount>0;n--){const it=state.inventory[n];if(it.marketItemId!=='mountStone')continue;const count=Number(it.count)||1,take=Math.min(count,amount);amount-=take;if(take===count)state.inventory.splice(n,1);else it.count=count-take}}
/* Mount training EXP: (level+1)*25, capped at 2500 from level 99 onward. */
const VM_STONE_XP=10,VM_LUCKY_STONE_CHANCE=.10,VM_LUCKY_STONE_XP=50;
function vmTrainNeed(level){return Math.min(Number(level)+1,100)*25}
function vmTrain(i,amount=1){const d=vmData(),t=d.training[i];if(!t||![1,50].includes(amount)||vmMountStoneCount()<amount)return toast('Binek Taşı yetersiz');vmSpendMountStones(amount);let lucky=0;for(let n=0;n<amount;n++)if(Math.random()<VM_LUCKY_STONE_CHANCE)lucky++;const gained=(amount-lucky)*VM_STONE_XP+lucky*VM_LUCKY_STONE_XP;t.xp+=gained;let levels=0;while(t.xp>=vmTrainNeed(t.level)){t.xp-=vmTrainNeed(t.level);t.level++;levels++}save();render();toast(amount+' taş kullanıldı: +'+gained+' EXP'+(lucky?' · '+lucky+' şanslı taş (50 EXP)!':'')+(levels?' · '+levels+' seviye yükseldi!':''))}
let vmSelectedTraining=0;
function vmSelectTraining(i){if(i<0||i>3)return;vmSelectedTraining=i;render()}

function vmMountImage(m){return {"threeDragon": "assets/img/f07f25a8c226c8b9.webp", "griffin": "assets/img/9a20e119354549f5.webp", "ayazkurt": "assets/img/f68942d26e1081eb.webp", "kozy ele": "assets/img/75d6a07c488a805d.webp", "gokkiran": "assets/img/e83de22d8a9874d3.webp", "ormanmuhafizi": "assets/img/c3e7de0ea01136c8.webp", "geceyelesi": "assets/img/9484909ae1457a9d.webp", "kizilpençe": "assets/img/df55382850d7c310.webp", "firtinakanat": "assets/img/0b8d202c522fd2f0.webp", "golgegeyik": "assets/img/a2f6c5be94c9bec6.webp", "obsidyenboynuz": "assets/img/c83552cdcdc3f956.webp", "ayisigi": "assets/img/268ab180931d99ad.webp", "atesgrifonu": "assets/img/e35395cc27b2d554.webp", "kadimejder": "assets/img/9ed9aaf4b90621c8.webp", "yildonumu30": "assets/img/0d76290a996e4902.webp", "yildonumu50": "assets/img/650124234ed5f7a2.webp"}[m.id]||''}
function vmDrawing(m){const image=vmMountImage(m);if(image)return '<img class="valor-mount-art" src="'+image+'" alt="'+escapeAttr(m.name)+'" loading="lazy" style="width:100%;height:100%;object-fit:contain;display:block">';const fill=m.color;const p={griffin:'M28 112 L43 78 61 58 86 69 105 55 124 67 137 59 153 73 147 88 125 90 114 114 97 117 90 145 79 145 78 118 62 120 54 146 43 146 42 115Z',wolf:'M28 112 L47 83 56 55 73 70 95 57 107 76 129 72 149 89 137 113 117 117 110 145 98 145 95 116 65 116 61 145 47 145 47 114Z',horse:'M28 119 L48 90 66 65 83 76 101 49 117 64 112 85 139 102 150 120 124 119 117 146 103 146 103 120 66 119 59 146 45 146 45 118Z',dragon:'M23 105 L43 73 58 90 81 43 93 80 119 57 126 85 154 100 134 113 128 144 111 144 109 117 69 116 62 144 47 144 46 115Z',stag:'M31 114 L49 86 62 70 72 44 79 73 98 74 114 44 118 76 137 94 147 117 121 117 116 146 104 146 104 117 68 117 61 146 46 146 46 117Z'}[m.kind];return '<svg viewBox="0 0 180 170" aria-label="'+m.name+'" role="img"><defs><linearGradient id="g-'+m.kind+'" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff2cf"/><stop offset=".45" stop-color="'+fill+'"/><stop offset="1" stop-color="#354458"/></linearGradient></defs><ellipse cx="90" cy="149" rx="66" ry="9" fill="#000" opacity=".45"/><path d="'+p+'" fill="url(#g-'+m.kind+')" stroke="#f9e5bd" stroke-width="2"/><path d="M56 93 Q90 68 121 98" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="4"/><circle cx="120" cy="84" r="3" fill="#fff6bb"/><path d="M30 103 L14 81 M36 100 L21 67" stroke="'+fill+'" stroke-width="5" stroke-linecap="round"/></svg>'}
function vmBoard(){const me={name:state.name||'Oyuncu',score:vmTotals().spirit,me:true};const others=[{name:'KuzeyHan',score:420},{name:'Arveth',score:355},{name:'Eldoria',score:295},{name:'KaraOk',score:180},{name:'Vaelrin',score:110}];const rank=[...others,me].sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name,'tr'));const winner=rank[0];return {winner,html:'<div class="vm-board"><h2>🏆 Binek Ruhu Sıralaması</h2><p class="vm-lead">Her gün 00.00 (Türkiye saati) için tasarlanmış örnek sıralama</p>'+rank.map((p,i)=>'<div class="vm-rank '+(p.me?'me':'')+'"><b>'+(i+1)+'.</b><span>'+(i===0?'<span class="vm-tag">[Binek Tanrısı] </span>':'')+escapeAttr(p.name)+(p.me?' (Sen)':'')+'</span><b>'+p.score+'</b></div>').join('')+'<p class="vm-notice">Bu sıralamadaki diğer oyuncular test verisidir. Gerçek günlük sıralama ve TAG dağıtımı için sunucu gereklidir.</p></div>'}}
function vmMountPage(){const d=vmData();const art=["assets/images/uc_basli_ejderha.webp","https://hyper3d.ai/images/best-mounts-and-how-to-acquire-them-in-throne-and-liberty.webp","https://ik.imagekit.io/storybird/images/355f3b60-2969-4367-ba71-c889700a8703/1_846851368.png?tr=q-80","https://static.displate.com/857x1200/displate/2023-11-02/5348be19742f28a740d36a7c243aa9cd_22fe2a20a7b9ecf3ef65a5736d2e7e66.jpg","https://rtncustomcreations.com/cdn/shop/collections/dragons-and-mythical-creatures.png?v=1763916148","https://cdn.budgetpixel.com/features/ai-creature-generator/og-card.jpg"];return '<div class="vm-page vm-simplified vm-framed-mounts">'+vmTrainingUI()+'<div class="vm-section-title"><div><span class="vm-eyebrow">AHIR · KOLEKSİYON</span><h2>Bineklerim</h2></div></div><div class="vm-cards">'+valorMounts.map((m,i)=>{const owned=m.id==='threeDragon'?dragonRegistered():d.owned.includes(m.id);const dragon=m.id==='threeDragon',token=dragon&&dragonTokenIndex()>=0;return '<article class="vm-card" style="--mount-color:'+m.color+'"><div class="vm-art vm-real-art" style="--vm-glow:'+m.color+'55"><img src="'+vmMountImage(m)+'" alt="'+m.name+' binek görseli" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><div class="vm-image-fallback" style="display:none">'+vmDrawing(m)+'</div></div><div class="vm-card-content"><h3>'+m.name+'</h3><div class="vm-spirit-stat">✦ Ruh Değeri <b>'+vmSpirit(m)+'</b></div><div class="vm-stats">'+['Güç','Zeka','Zırh','Beden'].map((k,j)=>'<span>'+k+' <b>+'+m.stats[j]+'</b></span>').join('')+'</div><div class="vm-card-state">'+(dragon?(owned?'✓ Koleksiyonda':token?'Çantada · Kullanılmadı':'🔒 Kilitli'):(owned?'✓ Koleksiyonda':'Kilitli'))+'</div>'+(dragon?(owned?'':token?'<button onclick="go(\'Çanta\')">Çantadan Kullan</button>':'<button onclick="go(\'Market\')">Marketten Al</button>'):'')+'</div></article>'}).join('')+'</div></div>'}
function vmDuplicate(id){const d=vmData();if(d.owned.includes(id)){d.cards.push(id);save();render();toast('Fazla binek kartı alındı. Parçalanabilir.')}else{d.owned.push(id);save();render()}}
function vmShatter(){const d=vmData();const n=d.cards.length;if(!n)return;d.souls+=n*10;d.cards=[];save();render();toast(n+' kart parçalandı, +'+n*10+' harcanabilir Binek Ruhu (test)')}
const vmOldRender=render;render=function(){if(page==='Binek'&&state.class){document.body.classList.remove('valor-home');document.getElementById('gold').textContent=valorCompactGold(state.gold);updateValorHudDetails();document.getElementById('diamonds').textContent=money(state.diamonds);document.getElementById('level').textContent=state.level;nav();document.getElementById('main').innerHTML=vmMountPage();return}vmOldRender()};

let veGemSelection=0,veGemLevel=1;
function veGemSlots(it){if(!it)return '';const gems=Array.isArray(it.gems)?it.gems:[];return '<div class="ve-gems"><div class="ve-gems-title">💎 Ekipman Taşları · '+gems.filter(Boolean).length+'/4</div><div class="ve-gem-grid">'+Array.from({length:4},(_,i)=>{const g=gems[i];return '<button type="button" class="ve-gem-slot '+(g?'filled':'')+'" style="--ve-gem-color:'+(g?veGemColors[veGemTypes.indexOf(g.type)]:'#eac278')+'" onclick="veOpenGem(\''+String(it.id)+'\','+i+')"><span class="ve-gem-symbol">'+(g?veGemIcons[veGemTypes.indexOf(g.type)]:'◇')+'</span><b>'+(g?g.type:'Boş Yuva')+'</b><small>'+(g?'Sv. '+g.level+' · +'+veGemValue(g.type,g.level):'Taş Tak')+'</small></button>'}).join('')+'</div></div>'}
function veFindItem(id){return (state.inventory||[]).find(x=>String(x.id)===String(id))||Object.values(state.equipped||{}).find(x=>x&&String(x.id)===String(id))}
function veAddToPopup(id,popupId){const it=veFindItem(id),box=document.getElementById(popupId);if(!it||it.marketItemId||it.slot==='Binek'||!box)return;const dialog=box.querySelector('.valor-item-dialog');if(!dialog)return;const buttons=dialog.querySelector('.detail-buttons,.valor-item-remove');if(buttons)buttons.insertAdjacentHTML('beforebegin',veGemSlots(it));else dialog.insertAdjacentHTML('beforeend',veGemSlots(it))}
const veOldBagPopup=showBagItemPopup;
showBagItemPopup=function(n){veOldBagPopup(n);const it=state.inventory[n];if(it)veAddToPopup(it.id,'valor-bag-popup')};
const veOldProfileDetails=showProfileDetails;
showProfileDetails=function(slot){veOldProfileDetails(slot);const it=state.equipped[slot];if(it)veAddToPopup(it.id,'valor-item-overlay')};
function veOpenGem(id,slot){const it=veFindItem(id);if(!it||slot<0||slot>3)return;document.getElementById('ve-gem-overlay')?.remove();const gems=Array.isArray(it.gems)?it.gems:[],current=gems[slot];veGemSelection=current?veGemTypes.indexOf(current.type):0;veGemLevel=current?current.level:1;const used=new Set(gems.filter((g,i)=>g&&i!==slot).map(g=>g.type));const overlay=document.createElement('div');overlay.className='ve-gem-modal';overlay.id='ve-gem-overlay';overlay.innerHTML='<div class="ve-gem-dialog"><h3>💎 '+(slot+1)+'. Taş Yuvası</h3><p>'+escapeAttr(it.name)+' · Aynı tür taş bir ekipmana yalnızca bir kez takılabilir.</p><div class="ve-gem-types">'+veGemTypes.map((type,i)=>'<button type="button" '+(used.has(type)?'disabled':'')+' style="--ve-gem-color:'+veGemColors[i]+'" class="'+(veGemSelection===i?'active':'')+'" onclick="veSelectGem('+i+')">'+veGemIcons[i]+' '+type+(used.has(type)?' · Takılı':'')+'</button>').join('')+'</div><label for="ve-gem-level">Taş Seviyesi (1–10)</label><select id="ve-gem-level" onchange="veGemLevel=Number(this.value);veUpdateGemPreview()">'+Array.from({length:10},(_,i)=>'<option value="'+(i+1)+'" '+(veGemLevel===i+1?'selected':'')+'>Seviye '+(i+1)+'</option>').join('')+'</select><p>Test aşaması: Taş envanteri ve taşların verdiği sayısal bonuslar henüz tanımlanmadı.</p><div class="ve-gem-controls"><button onclick="veCloseGem()">Vazgeç</button>'+(current?'<button onclick="veRemoveGem(\''+String(id)+'\','+slot+')">Taşı Çıkar</button>':'')+'<button onclick="veSaveGem(\''+String(id)+'\','+slot+')">Taşı Tak</button></div></div>';overlay.addEventListener('click',e=>{if(e.target===overlay)veCloseGem()});document.body.appendChild(overlay)}
function veSelectGem(i){veGemSelection=i;document.querySelectorAll('#ve-gem-overlay .ve-gem-types button').forEach((b,j)=>b.classList.toggle('active',j===i));veUpdateGemPreview()}
function veUpdateGemPreview(){const el=document.getElementById('ve-gem-preview');if(el)el.textContent='Taş bonusu: +'+veGemValue(veGemTypes[veGemSelection],veGemLevel)+' '+veGemTypes[veGemSelection]}
function veCloseGem(){document.getElementById('ve-gem-overlay')?.remove()}
function veRefreshItemGem(id){veCloseGem();const bag=document.getElementById('valor-bag-popup'),prof=document.getElementById('valor-item-overlay');if(bag){const n=state.inventory.findIndex(x=>String(x.id)===String(id));if(n>=0)showBagItemPopup(n)}else if(prof){const slot=Object.keys(state.equipped).find(k=>state.equipped[k]&&String(state.equipped[k].id)===String(id));if(slot)showProfileDetails(slot)}render()}
function veSaveGem(id,slot){const it=veFindItem(id);if(!it)return;const type=veGemTypes[veGemSelection],level=Number(veGemLevel);if(!type||!Number.isInteger(level)||level<1||level>10)return toast('Geçersiz taş');if(!Array.isArray(it.gems))it.gems=[];if(it.gems.some((g,i)=>i!==slot&&g&&g.type===type))return toast('Bu taş türü zaten takılı!');it.gems[slot]={type,level};save();veRefreshItemGem(id);toast(type+' taşı takıldı (Sv. '+level+')')}
function veRemoveGem(id,slot){const it=veFindItem(id);if(!it||!Array.isArray(it.gems))return;it.gems[slot]=null;save();veRefreshItemGem(id);toast('Taş çıkarıldı')}
</script>

</style><script id="valor-workshop-v2">
/* Atölye: Güçlendirme, Mozaik, Arıtma (sonra), Epik, Birleştir, Şans Taşı */
let vwSelectedItemId=null;
function vwInit(){if(!Array.isArray(state.gemInventory)){state.gemInventory=veGemTypes.map(type=>({type,level:1,count:1}));save()}if(!Number.isFinite(state.mountSpiritFragments))state.mountSpiritFragments=0;if(!Array.isArray(state.mountCraftCards))state.mountCraftCards=[]}
function vwGemCount(type,level){vwInit();return state.gemInventory.filter(g=>g.type===type&&g.level===level).reduce((a,g)=>a+(Number(g.count)||0),0)}
function vwAddGem(type,level,qty){vwInit();let g=state.gemInventory.find(g=>g.type===type&&g.level===level);if(!g){g={type,level,count:0};state.gemInventory.push(g)}g.count+=qty;state.gemInventory=state.gemInventory.filter(g=>g.count>0)}
/* Mosaic gem exchange: turn a gem into another type at the same level, 1:1. */
let vwSwapFrom=null,vwSwapTo=null;
function vwGemSwapPanel(){vwInit();const stacks=state.gemInventory.filter(g=>g.count>0).sort((a,b)=>veGemTypes.indexOf(a.type)-veGemTypes.indexOf(b.type)||b.level-a.level);
 if(vwSwapFrom&&!stacks.some(g=>g.type===vwSwapFrom.type&&g.level===vwSwapFrom.level)){vwSwapFrom=null;vwSwapTo=null}
 if(!stacks.length)return '<p class="vw-muted">Bir mozaik taşını aynı seviyede başka bir türe çevir.</p><div class="vw-action"><p>Çantanda mozaik taşı yok.</p></div>';
 const from=vwSwapFrom,count=from?vwGemCount(from.type,from.level):0;
 let html='<p class="vw-muted">Bir mozaik taşını aynı seviyede başka bir türe çevir. 1 taş → 1 taş.</p><h3 class="vw-gs-step">1. Çevrilecek taşı seç</h3><div class="vw-gs-list">'+stacks.map(g=>{const i=veGemTypes.indexOf(g.type),on=from&&from.type===g.type&&from.level===g.level;return '<button type="button" class="vw-gs-gem '+(on?'active':'')+'" style="--ve-gem-color:'+veGemColors[i]+'" onclick="vwSwapPick(\''+g.type+'\','+g.level+')">'+vgArt(g.type,g.level)+'<b>'+g.type+'</b><small>Sv. '+g.level+' · '+vwGemCount(g.type,g.level)+' adet</small></button>'}).join('')+'</div>';
 if(from){html+='<h3 class="vw-gs-step">2. Yeni türü seç</h3><div class="vw-gs-list">'+veGemTypes.map((type,i)=>type===from.type?'':'<button type="button" class="vw-gs-gem '+(vwSwapTo===type?'active':'')+'" style="--ve-gem-color:'+veGemColors[i]+'" onclick="vwSwapTarget(\''+type+'\')">'+vgArt(type,from.level)+'<b>'+type+'</b><small>Sv. '+from.level+' · +'+veGemValue(type,from.level)+'</small></button>').join('')+'</div>';
  if(vwSwapTo)html+='<div class="vw-action vw-gs-confirm"><div class="vw-gs-preview">'+vgArt(from.type,from.level)+'<i aria-hidden="true">→</i>'+vgArt(vwSwapTo,from.level)+'</div><p><b>'+from.type+' Sv.'+from.level+'</b> → <b>'+vwSwapTo+' Sv.'+from.level+'</b></p><div class="vw-gc-actions"><button type="button" onclick="vwSwapGems(false)">1 Taşı Çevir</button><button type="button" '+(count<2?'disabled':'')+' onclick="vwSwapGems(true)">Tümü · '+count+'</button></div></div>'}
 return html}
function vwSwapPick(type,level){vwSwapFrom={type,level:Number(level)};if(vwSwapTo===type)vwSwapTo=null;render()}
function vwSwapTarget(type){if(!veGemTypes.includes(type)||!vwSwapFrom||type===vwSwapFrom.type)return;vwSwapTo=type;render()}
function vwSwapGems(all){vwInit();const from=vwSwapFrom,to=vwSwapTo;if(!from||!to||!veGemTypes.includes(to)||to===from.type)return;const count=vwGemCount(from.type,from.level),n=all?count:Math.min(1,count);if(n<1)return toast('Bu taştan kalmadı');vwAddGem(from.type,from.level,-n);vwAddGem(to,from.level,n);save();render();toast(n+' × '+from.type+' Sv.'+from.level+' → '+n+' × '+to+' Sv.'+from.level)}
/* Mosaic gem combining: 4 gems of the same type and level -> 1 gem one level higher (max Sv.10). */
const VW_GEM_MERGE_COST=4,VW_GEM_MAX_LEVEL=10;
function vwGemCombinePanel(){vwInit();const rows=veGemTypes.map((type,i)=>{const levels=[...new Set(state.gemInventory.filter(g=>g.type===type&&g.count>0).map(g=>Number(g.level)))].sort((a,b)=>a-b);if(!levels.length)return '';return '<div class="vw-gc-type" style="--ve-gem-color:'+veGemColors[i]+'"><h3>'+type+'</h3>'+levels.map(level=>{const count=vwGemCount(type,level),max=level>=VW_GEM_MAX_LEVEL,can=Math.floor(count/VW_GEM_MERGE_COST);return '<div class="vw-gc-row"><div class="vw-gc-gem">'+vgArt(type,level)+(max?'':'<i aria-hidden="true">→</i>'+vgArt(type,level+1))+'</div><div class="vw-gc-info"><b>Sv. '+level+' <small>· '+count+' adet</small></b><span>'+(max?'En yüksek seviye':VW_GEM_MERGE_COST+' taş → 1 × Sv.'+(level+1)+' · +'+veGemValue(type,level+1))+'</span></div>'+(max?'':'<div class="vw-gc-actions"><button type="button" '+(can<1?'disabled':'')+' onclick="vwMergeGems(\''+type+'\','+level+',false)">Birleştir</button><button type="button" '+(can<2?'disabled':'')+' onclick="vwMergeGems(\''+type+'\','+level+',true)">Tümü · '+can+'</button></div>')+'</div>'}).join('')+'</div>'}).join('');return '<p class="vw-muted">Aynı tür ve seviyeden '+VW_GEM_MERGE_COST+' mozaik taşı, 1 üst seviye taşa dönüşür. Başarı %100. En yüksek seviye Sv.'+VW_GEM_MAX_LEVEL+'.</p>'+(rows||'<div class="vw-action"><p>Çantanda mozaik taşı yok.</p></div>')}
function vwMergeGems(type,level,all){vwInit();level=Number(level);if(!veGemTypes.includes(type)||!Number.isInteger(level)||level<1||level>=VW_GEM_MAX_LEVEL)return;const count=vwGemCount(type,level),times=all?Math.floor(count/VW_GEM_MERGE_COST):Math.min(1,Math.floor(count/VW_GEM_MERGE_COST));if(times<1)return toast(VW_GEM_MERGE_COST+' adet '+type+' Sv.'+level+' gerekli');vwAddGem(type,level,-times*VW_GEM_MERGE_COST);vwAddGem(type,level+1,times);save();render();toast(times*VW_GEM_MERGE_COST+' × '+type+' Sv.'+level+' → '+times+' × '+type+' Sv.'+(level+1))}
function vwGemBag(){vwInit();const gems=state.gemInventory.filter(g=>g.count>0);return '<div class="vw-gem-bag">'+(gems.length?gems.map(g=>{const i=veGemTypes.indexOf(g.type);return '<div class="vw-gem-chip" style="--ve-gem-color:'+veGemColors[i]+'"><b>◆ '+g.type+'</b><div>Sv. '+g.level+' · +'+veGemValue(g.type,g.level)+'</div><strong>Adet: '+g.count+'</strong></div>'}).join(''):'<p class="vw-muted">Çantanda taş bulunmuyor.</p>')+'</div>'}
function vwChooseItem(id){const picked=[...(state.inventory||[]),...Object.values(state.equipped||{}).filter(Boolean)].find(i=>String(i.id)===String(id));if(!picked)return toast('Seçilen eşya bulunamadı');vwSelectedItemId=picked.id;if(workTab==='enhance'){vwOpenEnhance(picked.id);return}render()}
function vwOpenEnhance(id){const picked=[...(state.inventory||[]),...Object.values(state.equipped||{}).filter(Boolean)].find(i=>String(i.id)===String(id));if(!picked)return toast('Eşya bulunamadı');vwSelectedItemId=picked.id;vwDrawEnhance()}
function vwCloseEnhance(){const el=document.getElementById('vw-enhance-overlay');if(el)el.remove();document.body.style.overflow=''}
function vwEnhanceItem(){return [...(state.inventory||[]),...Object.values(state.equipped||{}).filter(Boolean)].find(i=>String(i.id)===String(vwSelectedItemId))}
function vwUpdateChance(){const it=vwEnhanceItem(),select=document.querySelector('#vw-enhance-overlay select'),label=document.getElementById('vw-enhance-chance');if(!it||!label)return;const stone=Number(select?.value||0),base=it.plus<21?rates[it.plus]:0;label.textContent='%'+Math.min(100,Math.round((base+stone*10)*100)/100)}
function vwDrawEnhance(result){const it=vwEnhanceItem();if(!it)return vwCloseEnhance();const previous=document.getElementById('vw-enhance-overlay');const previousStone=previous?.querySelector('select')?.value||'0';if(previous)previous.remove();const cost=it.plus<21?costs[it.plus]:0,base=it.plus<21?rates[it.plus]:0;const overlay=document.createElement('div');overlay.id='vw-enhance-overlay';overlay.className='vw-enhance-overlay';overlay.innerHTML='<section class="vw-enhance-dialog" role="dialog" aria-modal="true" aria-label="Ekipman Güçlendirme"><button type="button" class="vw-enhance-close" aria-label="Kapat">×</button><div class="vw-enhance-kicker">✦ ATÖLYE · GÜÇLENDİRME ✦</div><img class="vw-enhance-art" src="'+equipmentIcon(it)+'" alt=""><h2>'+escapeAttr(it.name)+'</h2><div class="vw-enhance-plus">+'+(it.plus||0)+' <small>/ +21</small></div><div class="vw-enhance-stats"><div>Başarı Oranı <strong id="vw-enhance-chance">%'+base+'</strong></div><div>Altın Bedeli <strong>'+(it.plus<21?money(cost):'—')+'</strong></div></div><label class="vw-enhance-label">Şans Taşı<select><option value="0">Kullanma</option>'+Array.from({length:8},(_,n)=>n).filter(n=>Number(state.stones[n+1])>0).map(n=>'<option value="'+(n+1)+'">Seviye '+(n+1)+' · +%'+((n+1)*10)+' ('+(state.stones[n+1]||0)+')</option>').join('')+'</select></label><button type="button" class="vw-enhance-action" '+(it.plus>=21||state.gold<cost?'disabled':'')+'>GÜÇLENDİR</button><div class="vw-enhance-result '+(result?.success?'success':result?'failure':'')+'" role="status" aria-live="polite">'+(result?result.message:'Sonucu burada göreceksin.')+'</div></section>';overlay.addEventListener('click',e=>{if(e.target===overlay)vwCloseEnhance()});overlay.querySelector('.vw-enhance-close').addEventListener('click',vwCloseEnhance);overlay.querySelector('.vw-enhance-action').addEventListener('click',vwEnhanceNow);document.body.appendChild(overlay);document.body.style.overflow='hidden';const select=overlay.querySelector('select');if(select){if([...select.options].some(o=>o.value===previousStone))select.value=previousStone;select.addEventListener('change',vwUpdateChance)}vwUpdateChance()}
function vwEnhanceNow(){const it=vwEnhanceItem();if(!it)return toast('Eşya bulunamadı');const sel=document.querySelector('#vw-enhance-overlay select'),stone=Number(sel?.value||0),cost=costs[it.plus];if(it.plus>=21)return toast('Maksimum geliştirme seviyesi');if(state.gold<cost)return toast('Altın yetersiz');if(stone&&!(state.stones[stone]>0))return toast('Şans Taşı yetersiz');state.gold-=cost;if(typeof valorQuestRecord==='function')valorQuestRecord('enhance');if(stone)state.stones[stone]--;const chance=Math.min(100,rates[it.plus]+stone*10),success=Math.random()*100<chance;if(success)it.plus++;save();vwSelectedItemId=it.id;render();vwSelectedItemId=it.id;vwDrawEnhance({success,message:success?'✓ BAŞARILI! Ekipman +'+it.plus+' seviyesine yükseldi.':'✕ BAŞARISIZ! Ekipman +'+it.plus+' seviyesinde kaldı.'})}
function vwItemPicker(items){return '<div class="vw-item-list">'+items.map(it=>'<button class="vw-item '+(String(vwSelectedItemId)===String(it.id)?'active':'')+'" onclick="vwChooseItem(\''+String(it.id)+'\')"><img src="'+equipmentIcon(it)+'" alt=""><div>'+escapeAttr(it.name)+'</div><b>+'+(it.plus||0)+'</b></button>').join('')+'</div>'}

return '<div class="vw-shell"><details class="vw-top-dropdown"><summary>⚒ Atölye Menüsü <strong>'+names[workTab]+'</strong><span class="vw-chevron">▾</span></summary><nav class="vw-menu">'+[['enhance','⚒ Güçlendirme'],['mosaic','💎 Mozaik'],['gemcombine','◆ Mozaik Birleştir'],['gemswap','⇄ Mozaik Değişim'],['refine','✧ Arıtma'],['epic','✦ Epik'],['combine','♞ Birleştir'],['stones','◈ Şans Taşı'],['wings','✧ Kanat Birleştirme']].map(([k,label])=>'<button class="'+(workTab===k?'active':'')+'" onclick="workTab=\''+k+'\';render()">'+label+'</button>').join('')+'</nav></details><section class="vw-panel"><h2>'+names[workTab]+'</h2>'+content+'</section></div>'}

<script id="valor-gem-art-v2-script">
/* Şeffaf SVG mozaik taşları: aynı kristal silueti, seviyeye göre artan altın süsler. */
function vgArt(type,level){const index=veGemTypes.indexOf(type),n=Math.max(1,Math.min(10,Number(level)||1));if(index<0)return '';
const colors=[['#ff8982','#e92026','#7d0b15'],['#83dcff','#1586ff','#073b9e'],['#7bffb5','#16c96d','#075a39'],['#fff4a3','#ffc42d','#98600c'],['#eab1ff','#a73bea','#55118b'],['#b4b8c7','#34394b','#090b13'],['#ffffff','#dbe7f6','#8998b6']][index];
const a=colors[0],b=colors[1],c=colors[2],id='vg'+index+'x'+n;
const ring=n>=3?'<path d="M13 40 Q16 54 39 59 Q62 52 65 39" fill="none" stroke="#bd792c" stroke-width="'+(n>=7?4:2.5)+'"/><path d="M16 42 Q28 58 40 55 Q55 53 62 42" fill="none" stroke="#ffcf6b" stroke-width="1.5"/>':'';
const arms=n>=5?'<path d="M17 48 L7 36 L19 42 L24 54 M62 48 L72 36 L60 42 L55 54" fill="#9c601e" stroke="#ffd36d" stroke-width="1.4"/>':'';

/* Onaylanan 480x336 atlas: 10 sütun x 7 satır, her taş 48x48. */
const vgApprovedSpriteReady=true;
function vgApprovedTile(type,level){const row=veGemTypes.indexOf(type),col=Math.max(0,Math.min(9,(Number(level)||1)-1));if(row<0)return '';return '<span class="vg-sprite" style="background-position:'+(-col*48)+'px '+(-row*48)+'px"></span>'}
vgArt=function(type,level){return '<span class="vg-icon" role="img" aria-label="'+escapeAttr(type)+' Seviye '+Number(level)+'">'+vgApprovedTile(type,level)+'</span>'};
const vgOldInit=vwInit;
vwInit=function(){vgOldInit();if(!state.gemVisualTest70v1){state.gemVisualTest70v1=true;for(const type of veGemTypes)for(let level=1;level<=10;level++){let gem=state.gemInventory.find(g=>g.type===type&&g.level===level);if(gem)gem.count=(Number(gem.count)||0)+1;else state.gemInventory.push({type,level,count:1})}save()}}
vwGemBag=function(){vwInit();const gems=state.gemInventory.filter(g=>g.count>0).sort((a,b)=>veGemTypes.indexOf(a.type)-veGemTypes.indexOf(b.type)||a.level-b.level);return '<div class="vw-gem-bag">'+(gems.length?gems.map(g=>{const i=veGemTypes.indexOf(g.type);return '<div class="vw-gem-chip" style="--ve-gem-color:'+veGemColors[i]+'">'+vgArt(g.type,g.level)+'<div class="vg-meta"><b>'+g.type+'</b><div>Sv. '+g.level+' · +'+veGemValue(g.type,g.level)+'</div><strong>Adet: '+g.count+'</strong></div></div>'}).join(''):'<p class="vw-muted">Çantanda taş bulunmuyor.</p>')+'</div>'}
veGemSlots=function(it){if(!it)return '';const gems=Array.isArray(it.gems)?it.gems:[];return '<div class="ve-gems"><div class="ve-gems-title">💎 Ekipman Taşları · '+gems.filter(Boolean).length+'/4</div><div class="ve-gem-grid">'+Array.from({length:4},(_,i)=>{const g=gems[i];return '<button type="button" class="ve-gem-slot '+(g?'filled':'')+'" style="--ve-gem-color:'+(g?veGemColors[veGemTypes.indexOf(g.type)]:'#eac278')+'" onclick="veOpenGem(\''+String(it.id)+'\','+i+')">'+(g?vgArt(g.type,g.level):'<span class="ve-gem-symbol">◇</span>')+'<b>'+(g?g.type:'Boş Yuva')+'</b><small>'+(g?'Sv. '+g.level+' · +'+veGemValue(g.type,g.level):'Taş Tak')+'</small></button>'}).join('')+'</div></div>'}

<script id="valor-progress-systems-js">
const vsIcons=['⚔️','🔮','🛡️','✨','🎯','🛡️','❤️'];
const vsNames=['Saldırı','Sihirli Saldırı','Defans','Sihirli Defans','Kritik','Bloke','Can'],vsKeys=['Saldırı','Sihir','Savunma','Sihir Savunma','Kritik','Bloke','Can'],vsSteps=[200,200,200,200,50,50,400];

function vsData(){if(!state.valorSystems){state.valorSystems={tech:Array(7).fill(0),crystals:0,plots:Array(9).fill(0),dungeon:{day:'',cleared:0,best:0,coins:0}};save()}const d=state.valorSystems;if(d.dungeon.day!==vsToday()){d.dungeon.day=vsToday();d.dungeon.cleared=0;save()}return d}
function vsTechBonus(){const d=vsData(),out={};vsKeys.forEach((k,i)=>out[k]=(out[k]||0)+d.tech[i]*vsSteps[i]);return out}
function vsTechnology(){const d=vsData();return '<div class="vsys"><h2>🔮 Teknoloji</h2><p class="vsys-muted">💠 Kristal: '+d.crystals+' · Kristaller yalnızca çiftlik hasadından kazanılır. Geliştirme bedeli şimdilik 1 kristal.</p><div class="vsys-grid">'+vsNames.map((n,i)=>'<div class="vsys-card"><h3><span class="vsys-stat-icon" data-vi="'+(i+1)+'">'+''+'</span>'+n+'</h3><p>Seviye '+d.tech[i]+'/100 · Bonus +'+money(d.tech[i]*vsSteps[i])+'</p><div class="vsys-bar"><span style="width:'+d.tech[i]+'%"></span></div><p>Her seviye +'+vsSteps[i]+'</p><button '+(d.tech[i]>=100||d.crystals<1?'disabled':'')+' onclick="vsUpgrade('+i+')">Geliştir · 1 Kristal</button></div>').join('')+'</div></div>'}
function vsUpgrade(i){const d=vsData();if(i<0||i>6||d.tech[i]>=100)return;if(d.crystals<1)return toast('Kristal yetersiz');d.crystals--;d.tech[i]++;save();render();toast(vsNames[i]+' geliştirildi')}
function vsFarm(){const d=vsData(),open=Math.min(9,3+Math.floor(state.level/5)),now=Date.now();return '<div class="vsys valor-farm-growth"><h2>Kristal Çiftliği</h2><p class="vsys-muted">Kristal: '+d.crystals+' · Açık tarla: '+open+'/9. Kristal veya altın tohumu seç, 10 dakika sonra hasat et.</p><div class="vsys-plots">'+d.plots.map((time,i)=>{const locked=i>=open,g=valorFarmGrowth(time,now);return '<div class="vsys-card farm-growth-plot '+(g.ready?'farm-ready ':'')+(locked?'farm-locked':'')+(time&&valorFarmSeedType(i)==='gold'?' farm-gold':'')+'" '+(!locked?'data-plot="'+i+'"':'')+'><h3>Tarla '+(i+1)+'</h3><span class="farm-seed-label">'+(time?(valorFarmSeedType(i)==='gold'?'Altın Tohumu':'Kristal Tohumu'):'Boş Tarla')+'</span><div class="farm-growth-art">'+(locked?'<span class="farm-growth-lock">🔒</span>':'<img src="'+valorFarmSeedArt(i,Math.max(1,g.stage))+'" data-stage="'+Math.max(1,g.stage)+'" class="'+(!time?'farm-unplanted':'')+'" alt="'+(g.ready?'Hasada hazır kristaller':g.stage===2?'Büyüyen kristaller':time?'Yeni ekilmiş kristaller':'Boş tarla')+'">')+'</div><p class="farm-growth-status">'+(locked?'Sv. '+((i-2)*5)+' gerekli':!time?'Ekim bekliyor':g.ready?'Hasada hazır':(g.stage===1?'Filizleniyor · ':'Büyüyor · ')+valorFarmTime(g.remaining))+'</p>'+(!locked?'<div class="farm-growth-progress"><i style="width:'+(g.progress*100)+'%"></i></div><button '+(time&&!g.ready?'disabled':'')+' onclick="vsHarvest('+i+')">'+(!time?'Tohum Ek':g.ready?'Hasat Et':'Büyüyor')+'</button>':'')+'</div>'}).join('')+'</div></div>'}
function vsHarvest(i){const d=vsData();if(!Number.isInteger(i)||i<0||i>=Math.min(9,3+Math.floor(state.level/5)))return;const t=d.plots[i];if(!t)return valorOpenSeedPicker(i);if(Date.now()-t<600000)return;const type=valorFarmSeedType(i);d.plots[i]=0;if(d.plotSeeds)d.plotSeeds[i]=null;if(type==='gold'){state.gold+=1000;toast('+1.000 altın hasat ettin')}else{d.crystals++;toast('+1 kristal hasat ettin')}if(typeof valorQuestRecord==='function')valorQuestRecord('harvest');save();render()}
function vsBoss(f){const a=['Kül','Ayaz','Gölge','Kan','Fırtına','Kadim','Gece','Lanet','Yıldırım','Uçurum'],b=['Muhafızı','Ejderi','Celladı','Golemi','Şövalyesi','Cadısı','Devi','Yırtıcısı','Hükümdarı','Ruhu'];return a[Math.floor((f-1)/10)]+' '+b[(f-1)%10]}

function valorArenaData(){let changed=false;if(!state.arenaV1){state.arenaV1={day:'',used:0,wins:0,losses:0,history:[]};changed=true}const d=state.arenaV1,day=vsToday();if(d.day!==day){d.day=day;d.used=0;changed=true}if(!Number.isFinite(state.fame)){state.fame=0;changed=true}if(!Array.isArray(d.history)){d.history=[];changed=true}if(changed)save();return d}

function valorArenaStats(){const gear=equipmentBonuses(),mount=vmDerived(),tech=vsTechBonus(),out={};for(const key of ['Saldırı','Sihir','Savunma','Sihir Savunma','Can','Kritik','Bloke'])out[key]=Math.max(0,(Number(state.stats?.[key])||0)+(Number(gear[key])||0)+(Number(mount[key])||0)+(Number(tech[key])||0));return out}
function valorArenaUnit(stats,cls){const magic=cls==='Büyücü',attack=10+Math.max(0,Number(stats[magic?'Sihir':'Saldırı'])||0),hp=Math.max(1,Math.round(100+(Number(stats.Can)||0)*10));return {stats,magic,attack,maxHp:hp,hp}}
function valorArenaDamage(a,b){const defense=Math.max(0,Number(b.stats[a.magic?'Sihir Savunma':'Savunma'])||0);return Math.max(1,Math.round(a.attack*a.attack/(a.attack+defense)))}
function valorArenaChance(value){const points=Math.max(0,Number(value)||0);return Math.min(1,points<=1000?points/4000:.25+(points-1000)*.75/4000)}
function valorArenaHit(a,b,rng=Math.random){const critStat=Math.max(0,Number(a.stats.Kritik)||0),blockStat=Math.max(0,Number(b.stats.Bloke)||0),critical=rng()<valorArenaChance(critStat),blocked=rng()<valorArenaChance(blockStat),base=valorArenaDamage(a,b);return {damage:Math.max(1,Math.round(base*(1+(critical?.25:0)-(blocked?.25:0)))),critical,blocked}}
function valorArenaHitLabel(hit){if(!hit)return '';return (hit.critical?' <strong class="arena-critical">Kritik!</strong>':'')+(hit.blocked?' <strong class="arena-blocked">Bloke!</strong>':'')}
function valorArenaSimulate(myStats,myClass,rivalStats,rivalClass,rng=Math.random){const me=valorArenaUnit({...myStats},myClass),enemy=valorArenaUnit({...rivalStats},rivalClass),log=[];for(let round=1;round<=10;round++){let mine=0,theirs=0,myHit=null,enemyHit=null;const strikeMine=()=>{myHit=valorArenaHit(me,enemy,rng);mine=Math.min(enemy.hp,myHit.damage);enemy.hp-=mine},strikeEnemy=()=>{enemyHit=valorArenaHit(enemy,me,rng);theirs=Math.min(me.hp,enemyHit.damage);me.hp-=theirs};if(me.attack===enemy.attack){strikeMine();strikeEnemy()}else if(me.attack>enemy.attack){strikeMine();if(enemy.hp>0)strikeEnemy()}else{strikeEnemy();if(me.hp>0)strikeMine()}log.push({round,mine,theirs,myHit,enemyHit,myHp:me.hp,enemyHp:enemy.hp});if(me.hp===0||enemy.hp===0)break}const draw=me.hp===enemy.hp,win=!draw&&(enemy.hp===0||me.hp>0&&me.hp>enemy.hp);return {win,draw,rounds:log.length,myHp:me.hp,enemyHp:enemy.hp,myMaxHp:me.maxHp,enemyMaxHp:enemy.maxHp,reason:me.hp===0||enemy.hp===0?'knockout':'round-limit',log}}

function valorArenaPlayers(){const d=valorArenaData();if(!Array.isArray(d.opponents)||d.opponents.length<20){const names=["KuzeyHan","Arveth","Eldoria","KaraOk","Vaelrin","GölgeHan","Zephyriel","AyazLord","KızılKurt","AteşYeli","KadimOk","GeceKılıcı","DemirYürek","BuzPençesi","Fırtına","KülMuhafızı","GümüşYay","SarpKılıç","GeceAvcısı","Obsidyen"],base=Math.max(100,combatPower()),factors=[.30,.40,.50,.60,.70,.80,.88,.94,1,1.06,1.14,1.24,1.36,1.50,1.66,1.84,2.05,2.30,2.60,3];d.opponents=names.map((name,i)=>({id:i,name,level:Math.max(1,Math.min(100,state.level+i-9)),power:Math.max(1,Math.round(base*factors[i])),fame:(20-i)*5,wins:20-i,me:false,cls:classes[i%classes.length],portrait:heroImages[i%heroImages.length]}));save()}let expanded=false;const extraNames=['AlazHan','GeceOku','DemirPençe','KülRüzgarı','AlevKılıç','GümüşPençe','Kuzgun','BozkırHan','KaraSis','AkŞahin','Yıldırım','KorMuhafız','BuzOku','GölgeYel','ÇelikHan','KızılSis','AyIşığı','KaraPençe','TunçKılıç','SonMuhafız'];for(let id=20;id<40;id++){if(d.opponents.some(p=>p.id===id))continue;d.opponents.push({id,name:extraNames[id-20],level:Math.max(1,Math.min(100,state.level+20-id)),power:Math.max(1,Math.round(Math.max(100,combatPower())*Math.max(.15,.65-(id-20)*.02))),fame:0,wins:0,me:false,cls:classes[id%classes.length],portrait:heroImages[id%heroImages.length]});expanded=true}if(expanded)save();let changed=false;const snapshot=valorArenaStats(),base=Math.max(1,combatPower());for(const p of d.opponents){if(p.combatStats)continue;const ratio=Math.max(.1,p.power/base),mine=state.class==='Büyücü'?'Sihir':'Saldırı',primary=p.cls==='Büyücü'?'Sihir':'Saldırı';p.combatStats={};for(const k of Object.keys(snapshot).filter(k=>!k.startsWith('astrology')))p.combatStats[k]=Math.round(snapshot[k]*ratio);p.combatStats[primary]=Math.round(snapshot[mine]*ratio);p.combatStats[primary==='Sihir'?'Saldırı':'Sihir']=Math.round(snapshot[mine==='Sihir'?'Saldırı':'Sihir']*ratio);changed=true}if(changed)save();return d.opponents}
function valorArenaRanking(){const d=valorArenaData(),players=valorArenaPlayers(),ids=players.map(p=>p.id),valid=new Set([...ids,'me']);let ladder=Array.isArray(d.ladder)?d.ladder.filter((id,i,a)=>valid.has(id)&&a.indexOf(id)===i):[];if(!ladder.includes('me'))ladder=[...players.filter(p=>p.id<20)].sort((a,b)=>b.wins-a.wins||a.id-b.id).map(p=>p.id).concat('me');for(const id of ids)if(!ladder.includes(id))ladder.push(id);if(JSON.stringify(ladder)!==JSON.stringify(d.ladder)){d.ladder=ladder;save()}const all=new Map(players.map(p=>[p.id,p]));all.set('me',{id:'me',name:state.name||'Oyuncu',level:state.level,power:combatPower(),wins:d.wins,me:true,cls:state.class});return d.ladder.map(id=>all.get(id))}
function valorArenaCandidates(){const rows=valorArenaRanking(),index=rows.findIndex(p=>p.me),start=Math.max(0,Math.min(index-5,rows.length-11));return rows.slice(start,start+11).filter(p=>!p.me).map(p=>({...p,rank:rows.findIndex(row=>row.id===p.id)+1}))}
function valorArenaBadge(rank){if(rank>3)return '<span class="arena-rank-number">'+rank+'</span>';const colors=[['#edc46d','#6b441e'],['#d8e0eb','#576779'],['#c58d67','#5b3928']][rank-1];return '<span class="arena-rank-badge" aria-label="'+rank+'. sıra"><svg viewBox="0 0 48 52" aria-hidden="true"><path d="M8 16 Q1 29 12 40 M6 22 12 25 M6 29 13 31 M9 36 16 36 M40 16 Q47 29 36 40 M42 22 36 25 M42 29 35 31 M39 36 32 36" fill="none" stroke="'+colors[0]+'" stroke-width="2"/><path d="m14 38-2 13 12-6 12 6-2-13" fill="'+colors[1]+'" stroke="'+colors[0]+'"/><circle cx="24" cy="25" r="15" fill="'+colors[1]+'" stroke="'+colors[0]+'" stroke-width="2"/><path d="m17 14-2-6 6 3 3-7 3 7 6-3-2 6Z" fill="'+colors[0]+'"/><text x="24" y="31" text-anchor="middle" fill="'+colors[0]+'" font-family="Georgia,serif" font-size="19" font-weight="bold">'+rank+'</text></svg></span>'}

function valorArenaFight(id){if(page!=='Savaş'||!state.class||document.getElementById('valor-arena-result'))return;const d=valorArenaData();if(d.used>=10)return toast('Bugünkü 10 savaş hakkını kullandın');const rival=valorArenaCandidates().find(p=>p.id===id);if(!rival)return;const oldRank=d.ladder.indexOf('me')+1,targetRank=rival.rank;const battle=valorArenaSimulate(valorArenaStats(),state.class,rival.combatStats,rival.cls);d.used++;let gold=0,stone=0;if(battle.win){if(targetRank<oldRank){d.ladder.splice(oldRank-1,1);d.ladder.splice(targetRank-1,0,'me')}d.wins++;state.fame+=5;gold=500;state.gold+=gold;if(Math.random()<.10){const roll=Math.random();stone=roll<.60?1:roll<.90?2:3;addLuckStoneStack(stone,1)}}else if(battle.draw)d.draws=(d.draws||0)+1;else d.losses++;const result={...battle,oldRank,rank:battle.win?Math.min(targetRank,oldRank):oldRank,opponent:rival.name,gold,stone,fame:battle.win?5:0,at:Date.now()};d.last=result;d.history.unshift(result);d.history=d.history.slice(0,20);save();render();valorArenaResult(result)}
function valorArenaResult(result){document.getElementById('valor-arena-result')?.remove();const overlay=document.createElement('div');overlay.id='valor-arena-result';overlay.className='valor-item-overlay';overlay.innerHTML='<section class="valor-item-dialog arena-result-dialog" role="dialog" aria-modal="true" aria-labelledby="arena-result-title"><div class="arena-result-emblem">'+(result.win?'✦':'⚔')+'</div><h2 id="arena-result-title">'+(result.draw?'BERABERLİK':result.win?'ZAFER':'MAĞLUBİYET')+'</h2><p>'+escapeAttr(result.opponent)+' karşısında '+(result.draw?'berabere kaldın.':result.win?'kazandın.':'kaybettin.')+'</p><p>'+result.rounds+' tur · '+(result.reason==='knockout'?'Can tükendi':'Kalan canlar karşılaştırıldı')+'</p><div class="arena-health-summary"><span>Senin canın <b>'+money(result.myHp)+' / '+money(result.myMaxHp)+'</b></span><span>Rakibin canı <b>'+money(result.enemyHp)+' / '+money(result.enemyMaxHp)+'</b></span></div><details class="arena-combat-log" '+(result.training?'open':'')+'><summary>Tur detayları</summary>'+result.log.map(r=>'<div class="arena-turn"><b>'+r.round+'. tur</b><p>Verdiğin hasar: '+money(r.mine)+valorArenaHitLabel(r.myHit)+'</p><p>Aldığın hasar: '+money(r.theirs)+valorArenaHitLabel(r.enemyHit)+'</p></div>').join('')+'</details><div class="arena-result-rewards">'+(result.training?'<span>Deneme savaşı · Ödül ve sıralama değişmez.</span>':result.win?'<b>'+(result.rank?(result.rank<result.oldRank?'Yeni sıran: #':'Sıran: #')+result.rank:'Zafer')+'</b><b>+5 Şöhret</b><b>+'+money(result.gold)+' Altın</b>'+(result.stone?'<div class="arena-result-stone">'+luckStoneGraphic(result.stone)+'<span>+1 Şans Taşı Sv.'+result.stone+'</span></div>':''):'<span>Şöhret ve altın kaybetmedin.</span>')+'</div><p class="arena-result-remaining">Kalan hak: '+(result.training?'Sınırsız deneme':Math.max(0,10-valorArenaData().used)+'/10')+'</p>'+(result.training?'<button type="button" onclick="document.getElementById(\'valor-arena-result\').remove();valorArenaTraining()">Tekrar Dene</button>':'')+'<button type="button" onclick="document.getElementById(\'valor-arena-result\').remove()">Devam Et</button></section>';overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove()});document.body.appendChild(overlay)}

 const groupedLabels=new Set(['Savaş Gücü','Binek Ruhu','Can','Madalyon Canı']);
 return html.replace(/(<div class="vp-stat"><span>)([^<]*)(<\/span><b>)([^<]*)(<\/b><\/div>)/g,(all,a,label,b,value,c)=>{

 });

 const kinds=new Set(['epic','wheel-mount','anniversary-mount']);

 }

 function connectWheelNews(){

  const wrapped=function(){const previousSpins=Number(state.luckyWheelV1?.spins)||0,before=new Set(state.inventory.filter(it=>it.slot==='Binek').map(it=>it.id)),result=previous.apply(this,arguments);if((Number(state.luckyWheelV1?.spins)||0)>previousSpins)for(const it of state.inventory)if(it.slot==='Binek'&&!before.has(it.id))publish('wheel-mount',it.name);return result};
  wrapped.valorNewsWrapped=true;window.valorWheelSpin=wrapped;
 }
 connectWheelNews();
 document.addEventListener('load',event=>{if(event.target?.tagName==='SCRIPT'&&event.target.src.includes('/wheel/wheel.js'))connectWheelNews()},true);

 window.addEventListener('storage',event=>{if(event.key===STORAGE_KEY&&page==='Sohbet'&&activeTab==='news')render()});
})();
